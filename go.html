<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4338ca" />
<title>Trey on the go</title>
<!--
  Leaflet 1.9.4, pinned exactly — never "latest", because a CDN quietly moving
  the file under a fixed integrity hash gives you a blank map and no error.

  These are the two files cdnjs mirrors VERBATIM from Leaflet's own npm dist
  (leaflet.js and leaflet.css), so the integrity values below are Leaflet's own
  published SRI hashes for that release. Deliberately NOT leaflet.min.css: that
  one is minified by cdnjs itself, so its bytes are cdnjs's rather than
  Leaflet's and there is no upstream hash to check them against. A wrong hash
  fails silently — the browser simply refuses the file — which is precisely the
  defect class this repo keeps finding, so use the file you can verify.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!--
  FIELD PROSPECTING, for a phone, on a high street.

  Stand outside a row of shops, tap Find, and see every business around you
  ranked by how much Trey would help them — best door first. Tap one for its
  recent reviews and where it sits against the neighbours.

  DESIGN NOTES
  - Ranked by fieldScore (see nearby.js), NOT the desktop Opportunity score.
    Opportunity is built for scraped data with an owner reply rate and would put
    a 400-review cafe above an 8-review barber, which is backwards out here.
  - Reviews are shown, never stored. Google's Places terms restrict caching
    content, and the 15 Aug compliance audit flagged review text in a sales
    database as the most exposed thing in the repo. Save-as-lead writes only the
    durable facts: place ID, name, category, rating, count, phone, website.
  - The PECR verdict is shown BEFORE any contact button, so you know on the
    doorstep whether you may follow up by WhatsApp or only by phone/post.
  - Token is held in localStorage like admin.html/leads.html, sent as a header,
    never in a URL.
  - The map is Leaflet over OpenStreetMap tiles. It was a Google Static Maps
    picture with dots painted on top in CSS percentages, which meant no pinch,
    no scroll and no drag, and a billed Static Maps call every time you pressed
    the zoom button. Markers follow the filter and the sort as they always did.
  - Tiles need signal and this page is used where there isn't any. When they
    fail you get a plain message where the map would be, and the list — served
    from the on-phone cache — carries on working. A map is never allowed to
    take the leads down with it.
-->
<style>
  :root{--bg:#eef3fc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#4f46e5;--indigo:#4338ca;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));}
  header{background:linear-gradient(165deg,#4f46e5,#4338ca);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;position:sticky;top:0;z-index:5;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.3px;}
  .brand svg{height:26px;width:26px;}
  .sub{font-size:12.5px;opacity:.9;margin-top:3px;}
  main{padding:12px 12px 40px;max-width:640px;margin:0 auto;}
  .bar{display:flex;gap:8px;margin-bottom:12px;}
  button{font-family:inherit;border:0;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;padding:13px 16px;}
  .go{flex:1;background:var(--indigo);color:#fff;}
  .go:disabled{opacity:.55;}
  .sec{background:#fff;color:#334155;border:1px solid var(--border);padding:13px 14px;border-radius:11px;font-size:14px;font-weight:600;}
  select{font-family:inherit;font-size:14px;padding:12px 10px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--text);}
  .card{background:var(--card);border:1px solid #cfe0f6;border-radius:14px;padding:13px 14px;margin-bottom:10px;}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .name{font-weight:800;font-size:15.5px;letter-spacing:-.2px;}
  .cat{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .stats{font-size:13.5px;margin-top:6px;font-weight:600;}
  .stars{color:#f59e0b;}
  .score{flex:0 0 auto;text-align:center;min-width:62px;}
  .score b{display:block;font-size:20px;line-height:1.1;letter-spacing:-.5px;}
  .score span{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
  /* Stop number on a planned-walk card. Same disc, same colour and the same
     readable-text rule as the pin on the map above it and the stop card on the
     desk — one door is one colour and one number across all three surfaces.
     Only rendered in PLAN_MODE; an ordinary search result has no stop number
     and inventing one would imply an order that does not exist. */
  .plann{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;
       justify-content:center;font-weight:800;font-size:14px;border:2px solid #fff;
       box-shadow:0 1px 4px rgba(15,23,42,.35);margin-top:1px;}
  /* Come-back date. Orange like the pill it belongs to; red once it has passed.
     Sized for a thumb on a pavement, not a mouse at a desk. */
  .cbrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:8px 0 0;
       background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:9px 11px;}
  .cbrow.overdue{background:#fef2f2;border-color:#fecaca;}
  .cbrow input{font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:#fff;}
  .cblab{font-size:11.5px;font-weight:800;color:#9a3412;text-transform:uppercase;letter-spacing:.04em;}
  .cbrow.overdue .cblab{color:#b91c1c;}
  .cbwhen{font-size:13px;font-weight:700;color:#9a3412;}
  .cbrow.overdue .cbwhen{color:#b91c1c;}
  .cbwhen.muted{font-weight:400;color:var(--muted);}
  .knock b,.knock span{color:#047857;}
  .look b,.look span{color:#b45309;}
  /* #94a3b8 was 2.56:1 on the white card — unreadable outdoors. Same grey as
     the tier-3 pin, so the score text and its dot agree. */
  .skip b,.skip span{color:#64748b;}
  .gap{font-size:12.5px;color:#3730a3;background:#eef2ff;border:1px solid #c7d2fe;border-radius:9px;padding:7px 9px;margin-top:8px;line-height:1.45;}
  /* Compact PECR marker. The full verdict lives in the leads list, where the
     messaging actually happens — out here you're walking in, so it only needs to
     be a fact, not a paragraph. */
  .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;border:1px solid;margin-left:6px;vertical-align:1px;letter-spacing:.02em;}
  .tag.ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857;}
  .tag.no{background:#fffbeb;border-color:#fde68a;color:#92400e;}
  .tag.mine{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;}
  /* The Apify hook — the one thing the live Places search can never tell you. */
  .hook{font-size:12.5px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;
        border-radius:9px;padding:7px 9px;margin-top:8px;line-height:1.45;}
  .hookq{color:#9a3412;font-style:italic;margin-top:4px;font-size:12px;}
  .acts .signup{background:#047857;color:#fff;border-color:#047857;}
  /* Two deliberate rows rather than one that wraps raggedly on a phone. */
  .ctl{display:none;margin-bottom:12px;}
  .ctlrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .ctllab{flex:0 0 34px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .ctl button{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;color:#475569;}
  .ctl button.on{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
  .acts a,.acts button{font-size:13px;font-weight:700;padding:9px 12px;border-radius:9px;text-decoration:none;border:1px solid var(--border);background:#f8fafc;color:#334155;}
  .acts .prim{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .rev{border-top:1px solid #eef2f7;margin-top:10px;padding-top:9px;}
  .rev .r{font-size:13px;line-height:1.5;margin-bottom:9px;}
  .rev .r b{color:#b45309;}
  .rev .r.bad b{color:#b91c1c;}
  .rev .w{color:var(--muted);font-size:11.5px;}
  .note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px;}
  .msg{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;font-size:14px;line-height:1.6;color:#334155;}
  .msg b{color:var(--text);}
  .msg code{background:#f1f5f9;padding:2px 5px;border-radius:5px;font-size:12.5px;word-break:break-all;}
  .gate{max-width:380px;margin:60px auto;padding:0 16px;}
  .gate input{width:100%;padding:13px;border:1px solid var(--border);border-radius:11px;font-size:16px;margin-bottom:10px;}
  .mapwrap{position:relative;margin-bottom:12px;}
  /* z-index:0 makes the map its own stacking context. Leaflet's panes live at
     z-index 400-1000 and the sticky header is only z-index 5, so without this
     the map scrolls straight over the header. */
  .leafmap{height:300px;border-radius:12px;border:1px solid #cfe0f6;position:relative;z-index:0;}
  /* A marker is a plain coloured disc. Nothing here may set position or
     transform — Leaflet places the icon itself, and a second opinion about
     where it goes is how dots end up in the wrong street. */
  .leafpin{display:block;width:25px;height:25px;border-radius:50%;border:2px solid #fff;
       box-shadow:0 1px 4px rgba(15,23,42,.5);color:#fff;font-size:12px;font-weight:800;
       line-height:21px;text-align:center;cursor:pointer;}
  .leafpin.you{width:19px;height:19px;line-height:15px;font-size:10px;cursor:default;}
  /* No tiles. Sits ON the map rather than replacing it, so Leaflet stays alive
     and picks the tiles back up the moment the signal returns. Above every
     Leaflet pane and control, which top out at z-index 1000. */
  .mapoff{position:absolute;inset:0;z-index:1200;display:flex;align-items:center;
       justify-content:center;padding:14px;background:rgba(238,243,252,.94);border-radius:12px;}
  .mapoff .msg{margin:0;}
  .card{transition:box-shadow .25s;}
  .card.flash{box-shadow:0 0 0 3px #a5b4fc;}
  .maplegend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin:-6px 0 12px;flex-wrap:wrap;}
  .maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0;}
  .spin{text-align:center;color:var(--muted);font-size:14px;padding:26px 0;}
  .offline{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;
    padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:10px;}
  /* The day's tally. Small, always there, because the doors-to-signups number
     is the one thing a walk produces that nothing else can. */
  .tally{display:flex;gap:8px;margin-bottom:12px;}
  .tally div{flex:1;background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:8px 6px;text-align:center;}
  .tally b{display:block;font-size:18px;line-height:1.15;color:var(--indigo);}
  .tally span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  /* Zoom, and the status pills. Same five colours as the desk list. */
  .mapctl{display:flex;gap:6px;align-items:center;margin:-4px 0 10px;}
  .mapctl button{font-size:15px;font-weight:800;width:38px;height:38px;padding:0;border-radius:9px;
    border:1px solid var(--border);background:#fff;color:#334155;}
  .mapctl button:disabled{opacity:.4;}
  .mapctl .fit{width:auto;padding:0 12px;font-size:13px;font-weight:700;}
  .mapctl button.on{background:var(--indigo);color:#fff;border-color:var(--indigo);}
  .mapctl .lab{font-size:12px;color:var(--muted);}
  .pills{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}
  .pills button{font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:999px;
    border:1px solid transparent;opacity:.5;}
  .pills button.on{opacity:1;outline:2px solid rgba(0,0,0,.14);}
  .p-New{background:#e2e8f0;color:#334155;} .p-Comeback{background:#ffedd5;color:#9a3412;}
  .p-Contacted{background:#dbeafe;color:#1e40af;}
  .p-Ontrial{background:#fef9c3;color:#854d0e;} .p-Converted{background:#dcfce7;color:#166534;}
  .p-Lost{background:#fee2e2;color:#991b1b;}
  /* Doorstep consent. Deliberately plain and a bit serious-looking — this is a
     legal record being created in front of the person it's about, not a form. */
  .cbox{border:1px solid #c7d2fe;background:#f8faff;border-radius:11px;padding:11px;margin-top:10px;}
  .clab{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--indigo);margin-bottom:6px;}
  .cscript{font-size:13.5px;line-height:1.55;color:#1e293b;background:#fff;border:1px solid #e0e7ff;border-radius:9px;padding:9px 10px;margin-bottom:9px;}
  .cchan{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:9px;}
  .cchan label{font-size:13px;font-weight:700;color:#334155;display:flex;align-items:center;gap:5px;}
  .cchan input{width:19px;height:19px;accent-color:var(--indigo);}
  .cin{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;font-size:16px;margin-bottom:7px;font-family:inherit;}
  .cbtn{width:100%;border:0;}
  .cnote{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:7px;}
  .cnote.good{color:#047857;font-weight:700;}
  .cnote.bad{color:#b91c1c;font-weight:700;}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="msg">
    <div style="text-align:center;margin-bottom:12px;">
      <svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true"><g transform="rotate(-20 50 50)"><path d="M21.7,83.7 A44,44 0 1 1 78.3,83.7" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round" opacity="0.28"/><path d="M28.8,75.3 A33,33 0 1 1 71.2,75.3" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round" opacity="0.55"/><path d="M35.85,66.85 A22,22 0 1 1 64.15,66.85" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round"/></g><rect x="37" y="39" width="26" height="8" rx="2" fill="#4338CA"/><rect x="46" y="39" width="8" height="25" rx="2" fill="#4338CA"/></svg>
      <div style="font-weight:800;font-size:17px;margin-top:6px;">Trey on the go</div>
    </div>
    <input type="password" id="tok" placeholder="Admin token" autocomplete="current-password" />
    <button class="go" style="width:100%;" onclick="saveTok()">Enter</button>
    <div class="note" id="gateMsg"></div>
  </div>
</div>

<div id="app" style="display:none;">
<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-20 50 50)"><path d="M21.7,83.7 A44,44 0 1 1 78.3,83.7" fill="none" stroke="#eef2ff" stroke-width="5" stroke-linecap="round" opacity="0.35"/><path d="M28.8,75.3 A33,33 0 1 1 71.2,75.3" fill="none" stroke="#eef2ff" stroke-width="5" stroke-linecap="round" opacity="0.62"/><path d="M35.85,66.85 A22,22 0 1 1 64.15,66.85" fill="none" stroke="#eef2ff" stroke-width="5" stroke-linecap="round"/></g><rect x="37" y="39" width="26" height="8" rx="2" fill="#eef2ff"/><rect x="46" y="39" width="8" height="25" rx="2" fill="#eef2ff"/></svg>
    trey on the go
  </div>
  <div class="sub" id="hdr">Best door first &mdash; who to walk into, right now.</div>
</header>
<main>
  <!-- THE MAIN EVENT: your own leads, mirrored from the admin list. Same tier,
       same score, same hook as the desk screen, and NO Google calls at all —
       the sweep already paid for this data. -->
  <div class="bar">
    <button class="go" onclick="myLeadsNearMe()">My leads near me</button>
    <button class="go" onclick="todaysPlan()">Today’s plan</button>
    <select id="radius" aria-label="Search radius">
      <option value="150">150m</option>
      <option value="250" selected>250m</option>
      <option value="500">500m</option>
      <option value="1000">1km</option>
      <option value="2000">2km</option>
    </select>
  </div>
  <!-- Postcode needs no lookup at all: it matches the postcode already sitting
       in each lead's address. So it covers EVERY lead, not just the ones that
       have coordinates — and it works with no GPS, indoors, on a bus. -->
  <div class="bar">
    <input id="pcQ" placeholder="…or a postcode — e.g. DE1, or DE23 8SF" autocomplete="off"
      style="flex:1;min-width:0;font-family:inherit;font-size:15px;padding:13px 12px;border:1px solid var(--border);border-radius:11px;"
      onkeydown="if(event.key==='Enter')myLeadsByPostcode()" />
    <button class="sec" onclick="myLeadsByPostcode()">Go</button>
  </div>

  <!-- Secondary, and deliberately behind a fold: this is the only thing here
       that spends Google credit, and it is only needed for a shop the sweep
       never saw. -->
  <details style="margin-bottom:12px;">
    <summary style="font-size:12.5px;color:var(--muted);cursor:pointer;padding:7px 2px;">Not in my list? Search Google live &mdash; uses API credit</summary>
    <div class="bar" style="margin-top:9px;">
      <button class="sec" style="flex:1;" id="findBtn" onclick="find()">Find businesses near me</button>
    </div>
    <div class="bar">
      <input id="where" placeholder="…or a postcode / town" autocomplete="off"
        style="flex:1;min-width:0;font-family:inherit;font-size:15px;padding:13px 12px;border:1px solid var(--border);border-radius:11px;" />
      <button class="sec" onclick="findWhere()">Search</button>
    </div>
  </details>
  <div class="ctl" id="ctl">
    <div class="ctlrow">
      <span class="ctllab">Order</span>
      <button id="sortScore" class="on" onclick="setSort('score')">Best door</button>
      <button id="sortDist" onclick="setSort('distance')">Nearest</button>
    </div>
    <div class="ctlrow">
      <span class="ctllab">Show</span>
      <button id="fAll" class="on" onclick="setFilter('all')">All</button>
      <button id="fLook" onclick="setFilter('look')">Worth a look +</button>
      <button id="fKnock" onclick="setFilter('knock')">Knock now</button>
    </div>
  </div>
  <div id="tally"></div>
  <!-- The offline banner, the map and the list are three separate boxes on
       purpose. render() rewrites the list with innerHTML on every filter, sort
       and GPS tick — if the map lived in there, the Leaflet instance would be
       destroyed and every tile re-downloaded several times a minute. -->
  <div id="offlineBox"></div>
  <div id="mapBox" style="display:none;">
    <div class="mapctl" id="mapCtl"></div>
    <div class="mapwrap">
      <div id="mapCanvas" class="leafmap"></div>
      <div id="mapErr" class="mapoff" style="display:none;"></div>
    </div>
    <div class="maplegend" id="mapLegend"></div>
  </div>
  <div id="out"></div>
</main>
</div>

<script>
var API="/.netlify/functions/nearby", LEADS_API="/.netlify/functions/leads", WALK_API="/.netlify/functions/walk";
// sessionStorage, NOT localStorage (fixed 17 Aug 2026). This is the phone
// carried on a walk — the device most likely to be lost or handed over — and
// it holds the same shared admin token that can delete clients and export the
// whole database. admin.html and leads.html both use sessionStorage on purpose
// so closing the browser logs you out; the field tool was the odd one out.
var token=sessionStorage.getItem("treyAdminToken")||"";
var POOL=[], HERE=null, RADIUS=250, LABEL="";
var GMAP=null, TILES=null, GPINS=null, MEMARK=null;  // the Leaflet map and its layers
var MAPERR=null;       // why there is no map right now, in plain words
var PIN_SIG=null;      // the pin set the map was last framed to — see drawMap()

// WHERE THE CURRENT LIST CAME FROM, and why it decides whether there's a map.
//
// Google Maps Platform Service Specific Terms §10.2: "Customer must not use
// Google Maps Content from the Places API in conjunction with a non-Google map."
// The map is Leaflet + OpenStreetMap, so live Places results CANNOT be drawn on
// it. Saved leads can — their name, rating, address and coordinates all come
// from the Apify sweep and open-data geocoding, never from Google's APIs.
//
// DO NOT "fix" the missing map on live results. It is missing on purpose.
var POOL_IS_LIVE=false;

// The map container's own markup, so the live-results message can replace it and
// drawMap can put it back byte-for-byte. Kept next to POOL_IS_LIVE rather than
// read from the DOM at load, because by the time it is needed the DOM has
// already been overwritten.
var MAP_MARKUP='<div class="mapctl" id="mapCtl"></div>'+
  '<div class="mapwrap"><div id="mapCanvas" class="leafmap"></div>'+
  '<div id="mapErr" class="mapoff" style="display:none;"></div></div>'+
  '<div class="maplegend" id="mapLegend"></div>';
var COLOUR_BY="tier";  // "tier" (who to knock on) or "status" (where they've got to)
// "Come back" — the owner wasn't in. The commonest result of a cold knock, and
// the one you most need to find again tomorrow.
var STATUSES=["New","Come back","Contacted","On trial","Converted","Lost"];
var WATCH=null;        // geolocation watch id, while the page is in front of you
var LAST_RENDER_AT=null; // where you were when the list was last put in order
var statusCls=function(s){ return "p-"+String(s||"New").replace(/\s/g,""); };
// Leads already in the CRM, keyed by place ID. Swept from Apify the night before
// a new town, these carry the one thing Places CANNOT give you: whether the owner
// replies to reviews. See loadMyLeads().
var MINE={}, MINE_LOADED=false;

// PLAN MODE. When following a saved walk, the ORDER IS THE PRODUCT — it is the
// route route.js worked out. Re-sorting it by score or distance, which is right
// for browsing, silently throws that away and renumbers every pin. So in plan
// mode the sort is the plan, and the pin numbers are the plan's own numbers.
var PLAN_MODE=false;
var CENTRE_IS_ME=true; // false when the centre came from a typed postcode/town
var SORT="score";      // "score" = best door first, "distance" = nearest first
var FILTER="all";      // "all" | "look" (Knock now + Worth a look) | "knock"

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function stars(r){ if(r==null) return "—"; var n=Math.round(r); return "★".repeat(n)+"☆".repeat(5-n); }

function saveTok(){
  var v=document.getElementById("tok").value.trim();
  if(!v){document.getElementById("gateMsg").textContent="Paste your admin token.";return;}
  token=v; sessionStorage.setItem("treyAdminToken",v); showApp();
}
function showApp(){
  loadWalk(); document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; }
if(token) showApp();

async function api(payload){
  var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(payload)});
  if(r.status===403){ sessionStorage.removeItem("treyAdminToken"); location.reload(); return null; }
  var d=await r.json().catch(function(){return {};});
  if(!r.ok) throw Object.assign(new Error(d.error||("HTTP "+r.status)),{config:d.config});
  return d;
}

// Search a named place instead of your own position.
async function findWhere(){
  var q=document.getElementById("where").value.trim();
  if(!q){ document.getElementById("where").focus(); return; }
  var out=document.getElementById("out");
  out.innerHTML='<div class="spin">Looking up '+esc(q)+'…</div>';
  try{
    // includeMap:false — nearby.js can still build a Static Maps picture
    // (staticMap() is untouched), we simply never ask for one. Leaflet draws
    // the map now, so that image would be a billed Google call and a base64
    // blob roughly doubling the response, on a phone, for nothing.
    var d=await api({where:q,includeMap:false,radius:Number(document.getElementById("radius").value)});
    if(!d) return;
    HERE=d.centre||null; POOL=d.leads||[]; CENTRE_IS_ME=false;
    await loadMyLeads();
    PLAN_MODE=false; POOL_IS_LIVE=true;
    render(POOL,d.radius,d.placeLabel);
  }catch(e){
    out.innerHTML = e.config ? setupMsg() : '<div class="msg"><b>Couldn\'t search.</b><br>'+esc(e.message)+'</div>';
  }
}

function setupMsg(){
  return '<div class="msg"><b>Not set up yet.</b><br>This needs a Google Places API key in Netlify as <code>GOOGLE_PLACES_API_KEY</code>.<br><br>Google Cloud Console → enable <b>Places API (New)</b> → Credentials → create an API key → restrict it to Places API. Then add it in Netlify and redeploy.<br><br>It is <b>separate</b> from the Business Profile API application you\'re waiting on — no approval needed, just billing enabled.</div>';
}

function find(){
  var out=document.getElementById("out"), btn=document.getElementById("findBtn");
  if(!navigator.geolocation){ out.innerHTML='<div class="msg">This phone won\'t share its location with the browser.</div>'; return; }
  btn.disabled=true; out.innerHTML='<div class="spin">Finding your location…</div>';
  navigator.geolocation.getCurrentPosition(async function(pos){
    HERE={lat:pos.coords.latitude,lng:pos.coords.longitude};
    out.innerHTML='<div class="spin">Looking up what\'s around you…</div>';
    try{
      var d=await api({lat:HERE.lat,lng:HERE.lng,includeMap:false,radius:Number(document.getElementById("radius").value)});
      if(!d) return;
      POOL=d.leads||[]; CENTRE_IS_ME=true;
      await loadMyLeads();
      PLAN_MODE=false; POOL_IS_LIVE=true;
      render(POOL,d.radius);
      startWatching();
    }catch(e){
      out.innerHTML = e.config ? setupMsg() : '<div class="msg"><b>Couldn\'t search.</b><br>'+esc(e.message)+'</div>';
    }finally{ btn.disabled=false; }
  }, function(err){
    btn.disabled=false;
    out.innerHTML='<div class="msg"><b>Location unavailable.</b><br>'+esc(err.message||"")+'<br><br>On iPhone: Settings → Safari → Location. The page must also be on https, which trey.today is.</div>';
  }, {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}

// Pull the CRM list once per session. Cheap (no Places call at all) and it's
// what lets yesterday's desk work show up on today's pavement.
// ---- Working with no signal ------------------------------------------------
// A high street is exactly where mobile data gives up, and a field tool that
// shows a blank screen in a dead spot is worse than useless. So the list is
// cached on the phone, and anything you tap while offline is queued and sent
// when the signal comes back.
//
// Only the fields this page draws are cached — full records are several times
// larger and localStorage is a few megabytes, not unlimited.
var CACHE_KEY="treyLeadCache", QUEUE_KEY="treyQueue";
var OFFLINE=false, OFFLINE_SINCE=null;
var CACHE_FIELDS=["placeId","businessName","category","rating","reviewCount","phone",
  "website","address","lat","lng","tier","score","hook","ownerResponseRate",
  "recentUnanswered","legalStatus","marketingConsent","outreachStatus","isClient"];

function cacheLeads(arr){
  try{
    var slim=arr.map(function(l){
      var o={}; CACHE_FIELDS.forEach(function(f){
        if(l[f]!==undefined&&l[f]!==null&&l[f]!=="") o[f]=l[f]; });
      return o;
    });
    localStorage.setItem(CACHE_KEY,JSON.stringify({at:new Date().toISOString(),leads:slim}));
  }catch(e){ /* a full quota isn't worth failing a walk over */ }
}
function readCache(){
  try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(e){ return null; }
}

function queued(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]"); }catch(e){ return []; } }
function enqueue(item){
  try{ var q=queued(); q.push(item); localStorage.setItem(QUEUE_KEY,JSON.stringify(q.slice(-500))); }catch(e){}
}
async function flushQueue(){
  var q=queued();
  if(!q.length) return;
  var left=[];
  for(var i=0;i<q.length;i++){
    try{
      var r=await fetch(q[i].url,{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
        body:JSON.stringify(q[i].body)});
      if(!r.ok) left.push(q[i]);
    }catch(e){ left.push(q[i]); }
  }
  try{ localStorage.setItem(QUEUE_KEY,JSON.stringify(left)); }catch(e){}
  if(q.length!==left.length && POOL.length) render(POOL,RADIUS,LABEL);
}
window.addEventListener("online",function(){ OFFLINE=false; flushQueue(); });

// Send now if we can, queue it if we can't. Never lose a tap.
async function sendOrQueue(url,body){
  try{
    var r=await fetch(url,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify(body)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return true;
  }catch(e){ enqueue({url:url,body:body}); OFFLINE=true; return false; }
}

function offlineBanner(){
  if(!OFFLINE) return "";
  var age="";
  if(OFFLINE_SINCE){
    var mins=Math.round((Date.now()-Date.parse(OFFLINE_SINCE))/60000);
    age = mins<60 ? (mins+" min old") : (Math.round(mins/60)+"h old");
  }
  var q=queued().length;
  return '<div class="offline"><b>No signal &mdash; showing the copy on this phone</b>'+
    (age?" ("+esc(age)+")":"")+
    (q?'<br>'+q+' change'+(q===1?'':'s')+' waiting to be sent.':'')+'</div>';
}

// Pull the CRM list once per session. Cheap (no Places call at all) and it's
// what lets yesterday's desk work show up on today's pavement.
async function loadMyLeads(){
  if(MINE_LOADED) return;
  try{
    var r=await fetch(LEADS_API,{headers:{"Authorization":"Bearer "+token}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    var arr=await r.json();
    if(!Array.isArray(arr)) throw new Error("bad response");
    arr.forEach(function(l){ if(l.placeId) MINE[l.placeId]=l; });
    MINE_LOADED=true; OFFLINE=false;
    cacheLeads(arr);
    flushQueue();
  }catch(e){
    // No signal, or the server is down. Fall back to the copy on the phone and
    // SAY SO — silently showing yesterday's data as if it were live is how you
    // knock on a door you converted this morning.
    var c=readCache();
    if(c && c.leads && c.leads.length){
      c.leads.forEach(function(l){ if(l.placeId) MINE[l.placeId]=l; });
      MINE_LOADED=true; OFFLINE=true; OFFLINE_SINCE=c.at;
    }
  }
}

// Tier from the desk score, which is a BETTER signal than fieldScore when it
// exists — because it knows the reply rate and fieldScore never can.
function tierBand(t){ return t===1?"Knock now":t===2?"Worth a look":"Skip"; }

// What Places can't tell you, and Apify can: does this owner answer anybody?
function hookFor(l){
  var saved=l && l.placeId && MINE[l.placeId];
  if(!saved) return "";
  var bits="";
  var rr=String(saved.ownerResponseRate||"").trim();
  var un=Number(saved.recentUnanswered)||0;
  if(rr && rr!=="n/a"){
    var pct=parseInt(rr,10);
    bits+= (!isNaN(pct)&&pct<=20)
      ? '<b>Replies to '+esc(rr)+' of reviews.</b> '
      : 'Replies to '+esc(rr)+' of reviews. ';
  }
  if(un>0) bits+='<b>'+un+'</b> poor review'+(un===1?'':'s')+' left unanswered. ';
  if(!bits && !saved.hook) return "";
  return '<div class="hook">'+bits+
    (saved.hook?'<div class="hookq">'+esc(saved.hook)+'</div>':'')+'</div>';
}

function savedChip(l){
  var saved=l && l.placeId && MINE[l.placeId];
  if(!saved) return "";
  var st=saved.outreachStatus||"New";
  return '<span class="tag mine">in your list'+(st&&st!=="New"?' · '+esc(st):'')+'</span>';
}

// Turn a stored lead into the shape render() draws. This is the mirror: the
// tier, score and hook are EXACTLY what the admin screen shows — nothing is
// recomputed here, so the two screens can never disagree.
function asCard(l, metres){
  return {
    placeId:l.placeId, businessName:l.businessName, category:l.category,
    rating:l.rating==null?null:Number(l.rating), reviewCount:Number(l.reviewCount)||0,
    phone:l.phone, website:l.website, address:l.address, lat:l.lat, lng:l.lng,
    legalStatus:l.legalStatus, marketingConsent:l.marketingConsent,
    metresAway:metres, peerMedian:null, peerCount:0,
    field:{ total:Number(l.score)||0, band:tierBand(Number(l.tier)) },
  };
}

// Every lead that isn't already a customer. Clients aren't doors to knock on.
function prospects(){
  return Object.keys(MINE).map(function(k){ return MINE[k]; })
    .filter(function(l){ return !l.isClient && (l.outreachStatus||"New")!=="Converted"; });
}

// UK postcode, outward code only ("DE1" from "DE1 2PL"). 283 of 286 real leads
// carry a full postcode in their address, so matching on the stored text costs
// nothing and reaches every lead — including the ones with no coordinates.
var PC_RE=/\b([A-Z]{1,2}\d{1,2}[A-Z]?)\s*(\d[A-Z]{2})\b/i;
function outwardOf(text){
  var m=PC_RE.exec(String(text||""));
  return m?m[1].toUpperCase():"";
}

function myLeadsByPostcode(){
  var q=document.getElementById("pcQ").value.trim().toUpperCase().replace(/\s+/g," ");
  var out=document.getElementById("out");
  if(!q){ document.getElementById("pcQ").focus(); return; }
  // Accept a full postcode or just the outward part.
  var want=outwardOf(q)|| (/^[A-Z]{1,2}\d{1,2}[A-Z]?$/.test(q)?q:"");
  if(!want){ out.innerHTML='<div class="msg"><b>That doesn\'t look like a postcode.</b><br>Try <b>DE1</b>, or a full one like <b>DE23 8SF</b>.</div>'; return; }
  out.innerHTML='<div class="spin">Looking through your leads…</div>';
  (async function(){
    MINE_LOADED=false; MINE={};
    await loadMyLeads();
    var hits=prospects()
      .filter(function(l){ return outwardOf(l.address)===want; })
      .map(function(l){ return asCard(l, HERE?metresBetween(HERE,l):null); });
    if(!hits.length){
      var codes={};
      prospects().forEach(function(l){ var o=outwardOf(l.address); if(o) codes[o]=(codes[o]||0)+1; });
      var list=Object.keys(codes).sort(function(a,b){ return codes[b]-codes[a]; })
        .slice(0,8).map(function(c){ return c+" ("+codes[c]+")"; }).join(", ");
      out.innerHTML='<div class="msg"><b>No leads in '+esc(want)+'.</b>'+
        (list?'<br><br>You have leads in: '+esc(list)+'.':'')+'</div>';
      return;
    }
    HERE=null; CENTRE_IS_ME=false;
    POOL=hits;
    // The map comes free with the render now — there is no picture to fetch and
    // nothing to pay for, so both mirror paths get one without asking. Under
    // the old Static Maps version these two screens (the ones the field tool is
    // actually used from) had no map at all unless you happened to press +.
    PLAN_MODE=false; POOL_IS_LIVE=false;
    render(POOL,0,want);
  })();
}

// Show the leads you already have, nearest first, from stored coordinates.
// ZERO Google calls: no Places search, no map picture. This is the mode for the
// morning after an Apify sweep — and the only one that works before the key is set.
// TODAY'S PLAN — the route worked out at the desk, walked here.
//
// route.js plans at a desk on a big screen the night before; this follows it in
// order on the pavement. The plan holds only ids and coordinates, so each stop is
// looked up in the LIVE leads — a status you changed this morning is right
// tonight, and the Apify hook renders on every card exactly as it does elsewhere.
// That hook is the whole reason to walk the list in order: it is the thing to say
// when the door opens, and it costs no API call.
async function todaysPlan(){
  var out=document.getElementById("out");
  out.innerHTML='<div class="spin">Loading your plan…</div>';
  try{
    var r=await fetch(WALK_API+"?plan=1",{headers:{Authorization:"Bearer "+token}});
    if(r.status===403){ sessionStorage.removeItem("treyAdminToken"); location.reload(); return; }
    var d=await r.json();
    if(!d.plan||!d.plan.stops||!d.plan.stops.length){
      out.innerHTML='<div class="msg"><b>No plan saved yet.</b><br>'+
        'Plan a walk on the leads page, then press <b>Send to phone</b>.</div>';
      return;
    }
    await loadMyLeads();

    // Match each stop to its live lead. A stop whose lead has since been deleted
    // still walks — the plan carries its name and coordinates — but it is marked,
    // because silently dropping a door you meant to knock on is the failure this
    // codebase keeps making.
    var missing=0;
    var cards=d.plan.stops.map(function(st){
      var live=null;
      for(var k in MINE){ if(MINE[k] && MINE[k].id===st.id){ live=MINE[k]; break; } }
      if(!live){ missing++; live={ placeId:"", businessName:st.businessName, address:st.address,
                                   lat:st.lat, lng:st.lng, category:"", rating:null, reviewCount:0 }; }
      var c=asCard(live, HERE?metresBetween(HERE,{lat:st.lat,lng:st.lng}):null);
      c.planN=st.n;
      return c;
    });

    POOL=cards; POOL_IS_LIVE=false; PLAN_MODE=true; RADIUS=0;
    var when=new Date(d.plan.savedAt);
    LABEL="your plan \u2014 "+d.plan.stops.length+" doors, about "+d.plan.totalMinutes+" min";
    render(POOL,0,LABEL);
    document.getElementById("out").insertAdjacentHTML("afterbegin",
      '<div class="msg" style="margin-bottom:10px"><b>Today\u2019s plan</b> \u2014 '+
      d.plan.stops.length+' doors, about '+d.plan.totalMinutes+' minutes, '+
      (d.plan.distanceMetres>=1000
        ? (d.plan.distanceMetres/1000).toFixed(1)+'km'
        : d.plan.distanceMetres+'m')+' of walking. '+
      'Planned '+esc(when.toLocaleString())+'.'+
      (missing?'<br><b>'+missing+'</b> stop'+(missing===1?'':'s')+
        ' no longer match a saved lead \u2014 shown without their hook.':'')+
      '</div>');
  }catch(e){
    out.innerHTML='<div class="msg">Couldn\u2019t load the plan: '+esc(e.message)+
      '<br><span class="note">If you\u2019re offline, your saved leads still work.</span></div>';
  }
}

function myLeadsNearMe(){
  var out=document.getElementById("out");
  if(!navigator.geolocation){ out.innerHTML='<div class="msg">This phone won\'t share its location.</div>'; return; }
  out.innerHTML='<div class="spin">Finding your location…</div>';
  navigator.geolocation.getCurrentPosition(async function(pos){
    HERE={lat:pos.coords.latitude,lng:pos.coords.longitude};
    CENTRE_IS_ME=true;
    MINE_LOADED=false; MINE={};
    out.innerHTML='<div class="spin">Loading your leads…</div>';
    await loadMyLeads();
    var radius=Number(document.getElementById("radius").value)||250;
    var near=prospects()
      .filter(function(l){ return l.lat!=null&&l.lng!=null; })
      .map(function(l){ return asCard(l, metresBetween(HERE,l)); })
      .filter(function(l){ return l.metresAway!=null && l.metresAway<=radius; });
    if(!near.length){
      out.innerHTML='<div class="msg"><b>No saved leads within '+radius+'m.</b><br>'+
        'Try a wider radius, or use <b>Find businesses near me</b> for a live search.<br><br>'+
        '<span class="note">Leads only appear here once they have coordinates — the '+
        'Apify import brings them in, or use <b>Look up</b> on the leads map.</span></div>';
      return;
    }
    POOL=near;
    PLAN_MODE=false; POOL_IS_LIVE=false;
    render(POOL,radius,"your saved leads");
    startWatching();
  }, function(err){
    out.innerHTML='<div class="msg"><b>Location unavailable.</b><br>'+esc(err.message||"")+'</div>';
  }, {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}

// Haversine, metres. Mirrors metres() in nearby.js.
function metresBetween(a,b){
  if(!a||!b||a.lat==null||b.lat==null) return null;
  var R=6371000, t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+
        Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return Math.round(R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)));
}

// ---- Sign them up, there and then ----------------------------------------
// Hands the phone to the owner on the existing, tested signup flow rather than
// inventing a second way to create a client. Prefill goes via sessionStorage,
// NOT the query string — a business phone number in a URL ends up in browser
// history, and this phone is Matthew's, not theirs.
function signThemUp(i){
  var l=POOL[i]; if(!l) return;
  try{
    sessionStorage.setItem("treyPrefill", JSON.stringify({
      businessName:l.businessName||"", phone:l.phone||"", businessType:l.category||"",
      companyAddress:l.address||"",
      googleReviewUrl:l.placeId?("https://search.google.com/local/writereview?placeid="+l.placeId):"",
      from:"go", at:new Date().toISOString(),
    }));
  }catch(e){ /* private mode — they can still type it in */ }
  sendOrQueue(WALK_API,{event:"signup",placeId:l.placeId,businessName:l.businessName});
  window.open("/signup.html","_blank","noopener");
}

function setSort(v){
  // In plan mode the order is the route, so re-sorting would be a no-op. Leaving
  // the button looking pressed while nothing moved is the silent-failure pattern
  // this codebase keeps producing — so it drops out of plan mode and says so.
  if(PLAN_MODE){
    PLAN_MODE=false;
    document.getElementById("out").insertAdjacentHTML("afterbegin",
      '<div class="msg" style="margin-bottom:10px">Sorted out of plan order \u2014 '+
      'the route line is off. Press <b>Today\u2019s plan</b> to get it back.</div>');
  }
  SORT=v;
  document.getElementById("sortScore").className = v==="score"?"on":"";
  document.getElementById("sortDist").className  = v==="distance"?"on":"";
  render(POOL,RADIUS,LABEL);
}
function setFilter(v){
  FILTER=v;
  document.getElementById("fAll").className   = v==="all"?"on":"";
  document.getElementById("fLook").className  = v==="look"?"on":"";
  document.getElementById("fKnock").className = v==="knock"?"on":"";
  render(POOL,RADIUS,LABEL);
}

function bandCls(b){ return b==="Knock now"?"knock":b==="Worth a look"?"look":"skip"; }

// PECR marker, deliberately tiny. Walking in needs no permission — this is about
// the FOLLOW-UP, which is where the rule actually bites: message a sole trader
// cold next week and that's the breach. The full verdict and the consent tickbox
// live in the leads list, where the messaging happens.
function pecr(l,i){
  if(l.marketingConsent===true) return '<span class="tag ok" id="pec'+i+'" title="Consent recorded at the door.">consented · can message</span>';
  return l.legalStatus==="ltd"
    ? '<span class="tag ok" id="pec'+i+'" title="Limited company — cold email/WhatsApp allowed. Identify yourself and include an opt-out.">Ltd · can message</span>'
    : '<span class="tag no" id="pec'+i+'" title="Sole trader or unknown — no cold email/WhatsApp without consent. Ask on the doorstep and it opens up.">ask first to message</span>';
}

// Google's universal directions URL — opens the Maps app on a phone, walking
// mode, and uses the place ID so it lands on the right shop rather than a
// same-named one down the road.
function directionsUrl(l){
  if(l.lat==null||l.lng==null) return "";
  var u="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination="+
    encodeURIComponent(l.lat+","+l.lng);
  if(l.placeId) u+="&destination_place_id="+encodeURIComponent(l.placeId);
  return u;
}

function gapLine(l){
  if(l.peerMedian==null||!l.peerCount) return "";
  var rc=l.reviewCount||0;
  if(rc>=l.peerMedian) return '<div class="gap">Ahead of the local median ('+l.peerMedian+' reviews across '+l.peerCount+' similar nearby).</div>';
  var behind=l.peerMedian-rc;
  return '<div class="gap"><b>'+behind+' reviews behind</b> the local median of '+l.peerMedian+' ('+l.peerCount+' similar businesses nearby).</div>';
}

// ---- the map -------------------------------------------------------------
// Leaflet over OpenStreetMap tiles. This used to be a Google Static Maps
// picture with the dots painted on top as CSS percentages: no pinch, no
// scroll, no drag, and one billed Static Maps call every time you pressed the
// zoom button. Leaflet does the projection and the gestures itself, which is
// why map-pins.js and its hand-rolled Web Mercator maths are gone.
//
// TILES: OSM's public tile servers are free and need no key, and at our volume
// — one person on one walk — that is well inside their fair use. If it ever
// gets busy, move to a paid tile host such as MapTiler or Protomaps rather
// than leaning harder on a free service. Same L.tileLayer call, different URL.
//
// The attribution below is a LICENCE CONDITION of ODbL, not decoration.
// Do not remove it, hide it, or shrink it out of readability.
var OSM_TILES="https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";
var OSM_ATTRIB='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

// TIER COLOURS. Green = best door, amber = worth a look, grey = skip.
//
// This object is duplicated VERBATIM in leads.html and tests/map.test.js pulls
// it out of both files and compares them. Two maps using one palette to mean
// two different things was asking to be misread, and was. If you change a
// colour here, change it there.
// These carry WHITE text on the map pins, so each has to clear WCAG AA (4.5:1)
// against white. Tier 3 was #94a3b8 — 2.56:1, i.e. the plan number on a "Skip"
// pin was barely there in daylight, which is the only light this screen is ever
// used in. Must stay byte-identical to leads.html; map.test.js asserts it and
// recomputes the contrast rather than trusting the hex.
var TIER_COLOURS={"1":"#047857","2":"#b45309","3":"#64748b"};
// Pipeline colours, matched to the .p-* pills so a marker and its card agree.
var STATUS_COLOURS={"New":"#64748b","Come back":"#c2410c","Contacted":"#2563eb",
  "On trial":"#a16207","Converted":"#15803d","Lost":"#dc2626"};
var ME_COLOUR="#4338ca";
// Route furniture — the line between doors. Neutral, because a route spans
// doors of three different tiers and cannot carry a tier colour itself, and
// because indigo already means "already yours". Identical to leads.html.
var ROUTE_COLOUR="#0f172a";

// Derby city centre. Only ever seen for the half-second before the first
// fitBounds, and only if the map opens with nothing on it.
var HOME=[52.9225,-1.4746];

// NO TILES, AND WHY THAT IS FINE.
// Tiles need signal. This page is deliberately offline-first — there is a lead
// cache and a write queue because walks happen where there are no bars — so a
// dead tile server must cost you the map and nothing else. Same MAPERR channel
// every other map failure uses, so there is one place a map problem appears.
var OFFLINE_MAP_MSG="No map — you're offline. Your leads and the list still work.";
var TILE_FAILS=0;

function bandColour(b){
  return b==="Knock now"?TIER_COLOURS["1"]:b==="Worth a look"?TIER_COLOURS["2"]:TIER_COLOURS["3"];
}

function statusColour(l){
  var saved=l.placeId?MINE[l.placeId]:null;
  var st=(saved&&saved.outreachStatus)||"New";
  return STATUS_COLOURS[st]||STATUS_COLOURS["New"];
}

// White or near-black, whichever is readable ON `hex`. WCAG relative luminance
// then the standard contrast ratio against each candidate. Kept identical to
// leads.html's copy so one door is drawn the same on the desk and in the street.
function textOn(hex){
  var h=String(hex||"").replace("#","");
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return "#fff";
  var lin=function(c){ c/=255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); };
  var L=0.2126*lin(parseInt(h.slice(0,2),16))
       +0.7152*lin(parseInt(h.slice(2,4),16))
       +0.0722*lin(parseInt(h.slice(4,6),16));
  return (1.05/(L+0.05))>=((L+0.05)/0.0643) ? "#fff" : "#0f172a";
}

// A marker is a coloured disc we draw ourselves rather than Leaflet's default
// teardrop, so the tier palette is the only thing deciding what it looks like.
// `colour` is always one of our own constants; `label` is escaped.
function discIcon(colour,label,cls){
  var n=cls==="you"?19:25;
  return L.divIcon({
    className:"",   // "" drops Leaflet's default white-box .leaflet-div-icon
    html:'<span class="leafpin'+(cls?" "+cls:"")+'" style="background:'+colour+
         ';color:'+textOn(colour)+'">'+
         esc(label==null?"":label)+'</span>',
    iconSize:[n,n], iconAnchor:[n/2,n/2],
  });
}

function showMapErr(){
  var el=document.getElementById("mapErr");
  if(!el) return;
  if(!MAPERR){ el.style.display="none"; el.innerHTML=""; return; }
  el.style.display="";
  // Same shape as every other map failure on this page: say it plainly, offer
  // to try again, and never guess at a cause you don't have.
  el.innerHTML='<div class="msg"><b>'+esc(MAPERR)+'</b>'+
    '<div style="margin-top:8px"><button class="sec" style="padding:6px 10px" '+
    'onclick="retryTiles()">Try again</button></div></div>';
}

function retryTiles(){
  TILE_FAILS=0; MAPERR=null; showMapErr();
  if(TILES) TILES.redraw();
}

// One Leaflet instance for the life of the page. Re-creating it per render
// would throw away your pan and zoom and re-download every tile — and render()
// runs on every GPS tick.
function ensureMap(){
  if(GMAP) return GMAP;
  GMAP=L.map("mapCanvas",{scrollWheelZoom:true}).setView(HOME,16);
  TILES=L.tileLayer(OSM_TILES,{maxZoom:19,attribution:OSM_ATTRIB});
  TILES.on("tileload",function(){
    TILE_FAILS=0;
    if(MAPERR===OFFLINE_MAP_MSG){ MAPERR=null; showMapErr(); }
  });
  TILES.on("tileerror",function(){
    TILE_FAILS++;
    // navigator.onLine is the honest signal for "this phone knows it has no
    // data". Without it, a few failures usually just mean a couple of bad
    // tiles at the edge of the view, which isn't worth covering the map for.
    if(navigator.onLine===false || TILE_FAILS>=4){ MAPERR=OFFLINE_MAP_MSG; showMapErr(); }
  });
  TILES.addTo(GMAP);
  GPINS=L.layerGroup().addTo(GMAP);
  if(navigator.onLine===false){ MAPERR=OFFLINE_MAP_MSG; showMapErr(); }
  return GMAP;
}
// The browser telling us outright is better than waiting for four tiles to
// time out on a dead street.
window.addEventListener("offline",function(){ OFFLINE=true; MAPERR=OFFLINE_MAP_MSG; showMapErr(); });

// Tap a marker, get the card. The map answers "which way", the card answers
// "why" — so the popup is the short version and the button goes to the card.
function pinPopup(l,idx){
  return '<b>'+esc(l.businessName)+'</b>'+
    (l.category?'<div style="font-size:12px;color:#64748b;">'+esc(l.category)+'</div>':"")+
    '<div style="font-size:12.5px;margin-top:4px;"><b>'+esc(l.field.total)+'</b> · '+esc(l.field.band)+
      (l.metresAway!=null?' · '+esc(l.metresAway)+'m away':'')+'</div>'+
    (l.rating!=null?'<div style="font-size:12.5px;">'+esc(l.rating)+'★ · '+esc(l.reviewCount||0)+' reviews</div>':"")+
    '<div style="margin-top:7px;"><button class="sec" style="padding:6px 10px" '+
      'onclick="jump('+idx+')">Open this card</button></div>';
}

// Draw the markers for the current view. `view` is what passed the filter,
// `list` is everything — the difference is drawn small and faded, because a
// street you've filtered down to two doors is still a street.
function drawMap(view,list){
  var box=document.getElementById("mapBox");
  // Live Google results get no map — see POOL_IS_LIVE. Say so plainly rather
  // than showing an empty space that reads as a bug.
  if(POOL_IS_LIVE){
    box.style.display="block";
    box.innerHTML='<div class="msg" style="margin:0">No map on live Google results \u2014 '+
      'Google\'s terms don\u2019t allow their data on a non-Google map. '+
      'Your saved leads still show one.</div>';
    return;
  }
  // Restore the canvas if the live-search branch replaced it.
  if(!document.getElementById("mapCanvas")){ box.innerHTML=MAP_MARKUP; GMAP=null; }
  var pts=[];
  view.forEach(function(l){ if(l.lat!=null&&l.lng!=null) pts.push([l.lat,l.lng]); });
  if(HERE) pts.push([HERE.lat,HERE.lng]);
  // Nothing to draw is not a failure, it's an empty list.
  if(!pts.length){ box.style.display="none"; return; }
  box.style.display="block";
  ensureMap();
  // The container was display:none until a moment ago, so Leaflet still thinks
  // it has no size and will paint one tile in the corner.
  GMAP.invalidateSize();

  GPINS.clearLayers();
  var on={};
  view.forEach(function(l,i){
    var idx=POOL.indexOf(l); on[idx]=1;
    if(l.lat==null||l.lng==null) return;
    L.marker([l.lat,l.lng],{
      icon:discIcon(COLOUR_BY==="status"?statusColour(l):bandColour(l.field.band),
                    PLAN_MODE?(l.planN||i+1):i+1),
      title:l.businessName+" — "+l.field.band,
    }).bindPopup(pinPopup(l,idx)).addTo(GPINS);
  });
  // The route itself. The desk map draws this and the phone did not, which made
  // a carefully ordered walk look like scattered pins.
  if(PLAN_MODE){
    var legs=view.slice()
      .filter(function(l){ return l.lat!=null&&l.lng!=null; })
      .sort(function(a,b){ return (a.planN||0)-(b.planN||0); })
      .map(function(l){ return [l.lat,l.lng]; });
    if(HERE) legs.unshift([HERE.lat,HERE.lng]);
    if(legs.length>1){
      L.polyline(legs,{color:ROUTE_COLOUR,weight:3,opacity:.7,dashArray:"6,6"}).addTo(GPINS);
    }
  }

  // Deliberately subordinate: keeps the street recognisable without competing
  // with the doors you're actually going to.
  list.forEach(function(l){
    if(on[POOL.indexOf(l)]) return;
    if(l.lat==null||l.lng==null) return;
    L.circleMarker([l.lat,l.lng],{radius:5,color:"#fff",weight:1.5,
      fillColor:"#94a3b8",fillOpacity:.5}).addTo(GPINS);
  });
  if(HERE){
    MEMARK=L.marker([HERE.lat,HERE.lng],{
      icon:discIcon(ME_COLOUR,CENTRE_IS_ME?"Y":"+","you"),
      title:CENTRE_IS_ME?"You are here":"Search centre", zIndexOffset:1000,
    }).addTo(GPINS);
  } else MEMARK=null;

  // Frame the current results, but only when the set has actually changed — so
  // a new search frames itself, and toggling the colour or walking ten metres
  // doesn't yank the view out from under your thumb mid-tap.
  var sig=pts.map(function(p){ return p[0].toFixed(5)+","+p[1].toFixed(5); }).join("|");
  if(sig!==PIN_SIG){
    GMAP.fitBounds(L.latLngBounds(pts),{padding:[26,26],maxZoom:17});
    PIN_SIG=sig;
  }

  document.getElementById("mapCtl").innerHTML=
    '<button class="fit" onclick="fitPins()">Fit</button>'+
    (HERE?'<button class="fit" onclick="recentre()">Recentre</button>':'')+
    '<span style="flex:1"></span>'+
    '<button class="fit'+(COLOUR_BY==="tier"?" on":"")+'" onclick="setColourBy(\'tier\')">Tier</button>'+
    '<button class="fit'+(COLOUR_BY==="status"?" on":"")+'" onclick="setColourBy(\'status\')">Status</button>';

  var legend = COLOUR_BY==="status"
    ? Object.keys(STATUS_COLOURS).map(function(k){ return {colour:STATUS_COLOURS[k],label:k}; })
        .concat([{colour:ME_COLOUR,label:CENTRE_IS_ME?"You":"Centre"}])
    : [{colour:TIER_COLOURS["1"],label:"Knock now"},{colour:TIER_COLOURS["2"],label:"Worth a look"},
       {colour:TIER_COLOURS["3"],label:"Skip"},{colour:ME_COLOUR,label:CENTRE_IS_ME?"You":"Centre"}];
  if(view.length<list.length) legend.push({colour:"#94a3b8",label:"Hidden by filter",faint:true});
  document.getElementById("mapLegend").innerHTML=legend.map(function(x){
    return '<span><i style="background:'+esc(x.colour)+(x.faint?";opacity:.5;width:7px;height:7px":"")+
      '"></i>'+esc(x.label)+'</span>';
  }).join("");

  showMapErr();
}

// Frame every pin again after you've panned off. Deliberately not through
// render() — re-framing isn't the same event as the list changing.
function fitPins(){ PIN_SIG=null; render(POOL,RADIUS,LABEL); }
function recentre(){ if(GMAP&&HERE) GMAP.setView([HERE.lat,HERE.lng],GMAP.getZoom()); }

function setColourBy(v){ COLOUR_BY=v; render(POOL,RADIUS,LABEL); }

// ---- Today's tally ---------------------------------------------------------
// Doors knocked, and how many became signups. This is the number the whole
// runner question turns on — see claude/trey-go-runner-model.md — and it can
// only be captured as it happens.
async function loadWalk(){
  var el=document.getElementById("tally");
  if(!el) return;
  try{
    var r=await fetch(WALK_API+"?days=14",{headers:{"Authorization":"Bearer "+token}});
    if(!r.ok) return;
    var d=await r.json();
    var today=(d.days||[])[0]||{doors:0,signups:0};
    var t=d.totals||{};
    el.innerHTML='<div class="tally">'+
      '<div><b>'+today.doors+'</b><span>doors today</span></div>'+
      '<div><b>'+today.signups+'</b><span>signed today</span></div>'+
      '<div><b>'+t.doors+'</b><span>doors 14d</span></div>'+
      '<div><b>'+(t.conversionPct==null?"&mdash;":t.conversionPct+"%")+'</b><span>'+
        (t.doorsPerSignup?("1 in "+t.doorsPerSignup):"conversion")+'</span></div>'+
      '</div>';
  }catch(e){ /* the tally is never worth blocking a walk for */ }
}

// ---- Following you as you walk ---------------------------------------------
// getCurrentPosition fires ONCE. On a tool you use while walking down a street
// that means the "you" dot and every distance are wrong within a minute.
//
// So: watch continuously, but be careful what that triggers.
//   - moving the dot and rewriting the distances is FREE (both are local maths)
//   - re-ordering the list is NOT free to the user — a list that reshuffles
//     under your thumb mid-tap is horrible — so it only happens after 50m,
//     which at walking pace is about 40 seconds
//   - the map PICTURE is never re-fetched automatically, because that costs a
//     Static Maps call every time. You get a Recentre button instead.
function startWatching(){
  if(WATCH!=null || !navigator.geolocation) return;
  WATCH=navigator.geolocation.watchPosition(function(pos){
    var was=HERE;
    HERE={lat:pos.coords.latitude,lng:pos.coords.longitude};
    if(!POOL.length) return;
    POOL.forEach(function(l){
      if(l.lat!=null&&l.lng!=null) l.metresAway=metresBetween(HERE,l);
    });
    var movedSinceOrder = LAST_RENDER_AT ? metresBetween(LAST_RENDER_AT,HERE) : 1e9;
    if(movedSinceOrder!=null && movedSinceOrder>50){
      render(POOL,RADIUS,LABEL);          // far enough that the order is stale
    }else{
      updateInPlace(was);                 // just move the dot and the numbers
    }
  }, function(){ /* a dropped fix isn't worth interrupting a walk for */ },
     {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}

function stopWatching(){
  if(WATCH!=null && navigator.geolocation) navigator.geolocation.clearWatch(WATCH);
  WATCH=null;
}
// Don't hold the GPS open while the phone is in a pocket.
document.addEventListener("visibilitychange",function(){
  if(document.hidden) stopWatching(); else if(POOL.length&&CENTRE_IS_ME) startWatching();
});

// Cheap refresh: the "you" marker and the distance labels only. No re-order,
// no tile fetch — Leaflet keeps the tiles it already has, so walking down a
// street costs nothing at all now.
function updateInPlace(){
  if(MEMARK&&HERE) MEMARK.setLatLng([HERE.lat,HERE.lng]);
  POOL.forEach(function(l){
    var el=document.getElementById("dist"+POOL.indexOf(l));
    if(el&&l.metresAway!=null) el.textContent=" \u00b7 "+l.metresAway+"m away";
  });
}

// Set where a business has got to, from the doorstep. Writes to the same leads
// store the desk list reads, so the two are never out of step.
async function setStatus(i,st){
  var l=POOL[i]; if(!l||!l.placeId) return;
  var box=document.getElementById("st"+i);
  if(box) Array.prototype.forEach.call(box.querySelectorAll("button"),function(b){
    b.className=statusCls(b.getAttribute("data-s"))+(b.getAttribute("data-s")===st?" on":""); });
  await sendOrQueue(LEADS_API,{lead:{
    placeId:l.placeId, businessName:l.businessName, outreachStatus:st,
    category:l.category, phone:l.phone, address:l.address,
  }});
  // A door is a business you set a status on. Logged separately from the lead,
  // because a lead only remembers where it ended up — not that you walked past
  // it on Tuesday. See walk.js.
  await sendOrQueue(WALK_API,{event:"door",placeId:l.placeId,
    businessName:l.businessName,status:st});
  if(MINE[l.placeId]) MINE[l.placeId].outreachStatus=st;
  else MINE[l.placeId]={placeId:l.placeId,businessName:l.businessName,outreachStatus:st};
  // "Come back" is the most common outcome of a knock, and THIS is where the
  // promise is actually made — standing on the doorstep, not at the desk that
  // evening. Choosing it seeds 9am tomorrow so the date is never simply absent;
  // moving off it clears the date, because a callback you no longer intend to
  // make must not keep turning up in the morning email.
  if(st==="Come back" && !MINE[l.placeId].comeBackAt){
    var seeded=defaultComeBack();
    MINE[l.placeId].comeBackAt=seeded;
    await sendOrQueue(LEADS_API,{lead:{placeId:l.placeId,comeBackAt:seeded}});
  } else if(st!=="Come back" && MINE[l.placeId].comeBackAt){
    MINE[l.placeId].comeBackAt="";
    await sendOrQueue(LEADS_API,{lead:{placeId:l.placeId,comeBackAt:""}});
  }
  if(COLOUR_BY==="status") render(POOL,RADIUS,LABEL);
  loadWalk();
}

function statusPills(l,i){
  if(!l.placeId) return "";
  var saved=MINE[l.placeId];
  var cur=(saved&&saved.outreachStatus)||"New";
  return '<div class="pills" id="st'+i+'">'+STATUSES.map(function(s){
    return '<button data-s="'+esc(s)+'" class="'+statusCls(s)+(s===cur?" on":"")+
      '" onclick="setStatus('+i+',\''+s+'\')">'+esc(s)+'</button>';
  }).join("")+'</div>'+comeBackRow(l,i);
}

// 9am tomorrow as a real instant. Built in the BROWSER because only the browser
// knows the timezone — leads.js runs on UTC and would put a Derby 9am an hour
// out all summer.
function defaultComeBack(){
  var d=new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
  return d.toISOString();
}
// An instant -> the "YYYY-MM-DDTHH:MM" a datetime-local input wants, in LOCAL
// time. toISOString() would render UTC and show the wrong hour in the box.
function toLocalInput(iso){
  var t=Date.parse(iso||""); if(!isFinite(t)) return "";
  var d=new Date(t), p=function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
}
function comeBackLabel(iso){
  var t=Date.parse(iso||""); if(!isFinite(t)) return null;
  var due=new Date(t), startOf=function(d){ var x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
  var days=Math.round((startOf(due)-startOf(new Date()))/86400000);
  var hhmm=String(due.getHours()).padStart(2,"0")+":"+String(due.getMinutes()).padStart(2,"0");
  if(days<0) return {text:(days===-1?"yesterday":Math.abs(days)+" days ago")+" \u00b7 "+hhmm, overdue:true};
  if(days===0) return {text:"today \u00b7 "+hhmm, overdue:due.getTime()<Date.now()};
  if(days===1) return {text:"tomorrow \u00b7 "+hhmm, overdue:false};
  return {text:"in "+days+" days \u00b7 "+hhmm, overdue:false};
}
// Only for "Come back". Six statuses each carrying an empty date box is noise.
function comeBackRow(l,i){
  if(!l.placeId) return "";
  var saved=MINE[l.placeId];
  if(!saved || saved.outreachStatus!=="Come back") return "";
  var lab=comeBackLabel(saved.comeBackAt);
  return '<div class="cbrow'+(lab&&lab.overdue?" overdue":"")+'">'+
    '<span class="cblab">Come back</span>'+
    '<input type="datetime-local" id="cb'+i+'" value="'+esc(toLocalInput(saved.comeBackAt))+'" onchange="saveComeBack('+i+')" />'+
    (lab?'<span class="cbwhen">'+esc(lab.text)+'</span>':'<span class="cbwhen muted">no date set</span>')+
    '</div>';
}
async function saveComeBack(i){
  var l=POOL[i]; if(!l||!l.placeId) return;
  var el=document.getElementById("cb"+i); if(!el) return;
  // "" clears — leads.js reads this key from the raw body so that is possible.
  var iso=el.value ? new Date(el.value).toISOString() : "";
  if(MINE[l.placeId]) MINE[l.placeId].comeBackAt=iso;
  await sendOrQueue(LEADS_API,{lead:{placeId:l.placeId,comeBackAt:iso}});
  render(POOL,RADIUS,LABEL);
}

// Tap a dot, get the card. The map answers "which way", the card answers "why".
function jump(idx){
  var el=document.getElementById("c"+idx);
  if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.classList.add("flash");
  setTimeout(function(){ el.classList.remove("flash"); },1400);
}

function render(list,radius,label){
  var out=document.getElementById("out");
  RADIUS=radius; LABEL=label||"";
  if(HERE) LAST_RENDER_AT={lat:HERE.lat,lng:HERE.lng};
  document.getElementById("ctl").style.display = list.length ? "block" : "none";

  // Filter by band, then sort. Both are pure view state — no refetch, no extra
  // API spend for changing your mind on the pavement.
  var view=list.filter(function(l){
    if(FILTER==="knock") return l.field.band==="Knock now";
    if(FILTER==="look")  return l.field.band==="Knock now"||l.field.band==="Worth a look";
    return true;
  }).slice().sort(function(a,b){
    // The plan's order wins over both sorts. Without this the list and the map
    // renumber themselves and the route reads as random.
    if(PLAN_MODE) return (a.planN||0)-(b.planN||0);
    if(SORT==="distance"){
      var da=a.metresAway==null?1e9:a.metresAway, db=b.metresAway==null?1e9:b.metresAway;
      return da-db || b.field.total-a.field.total;
    }
    return b.field.total-a.field.total || (a.metresAway||0)-(b.metresAway||0);
  });

  document.getElementById("hdr").textContent =
    view.length+" of "+list.length+
    (radius?(" within "+radius+"m of "+(label||"you")):(" in "+(label||"your list")))+
    " · "+(SORT==="distance"?"nearest first":"best door first");

  // Banner, map and list are written separately so the map keeps its Leaflet
  // instance across a render. The order on screen is unchanged.
  document.getElementById("offlineBox").innerHTML=offlineBanner();
  drawMap(view, list);

  if(!view.length){ out.innerHTML='<div class="msg">Nothing in that band here. Try <b>All</b>, or a wider radius.</div>'; return; }
  out.innerHTML=view.map(function(l,i){
    var idx=POOL.indexOf(l);
    // Colour the stop number exactly as its pin is coloured — same expression
    // drawMap() uses — so the "3" you read on the card is the "3" you look for
    // on the map. textOn() keeps the digit readable whatever that colour is.
    var pc = COLOUR_BY==="status"?statusColour(l):bandColour(l.field.band);
    return '<div class="card" id="c'+idx+'">'+
      '<div class="row">'+
        (PLAN_MODE
          ? '<span class="plann" style="background:'+pc+';color:'+textOn(pc)+'">'+
            esc(l.planN||i+1)+'</span>'
          : '')+
        '<div style="flex:1;min-width:0;">'+
          '<div class="name">'+esc(l.businessName)+pecr(l,idx)+savedChip(l)+'</div>'+
          '<div class="cat">'+esc(l.category||"—")+'<span id="dist'+idx+'">'+(l.metresAway!=null?' · '+l.metresAway+'m away':'')+'</span></div>'+
          '<div class="stats"><span class="stars">'+stars(l.rating)+'</span> '+(l.rating!=null?l.rating:"unrated")+' · <b>'+(l.reviewCount||0)+'</b> review'+((l.reviewCount||0)===1?"":"s")+'</div>'+
        '</div>'+
        '<div class="score '+bandCls(l.field.band)+'"><b>'+l.field.total+'</b><span>'+esc(l.field.band)+'</span></div>'+
      '</div>'+
      gapLine(l)+hookFor(l)+
      '<div class="acts">'+
        '<button class="prim" onclick="details('+idx+')">Reviews &amp; rivals</button>'+
        (directionsUrl(l)?'<a href="'+esc(directionsUrl(l))+'" target="_blank" rel="noopener">Directions</a>':'')+
        (l.phone?'<a href="tel:'+esc(l.phone.replace(/\s/g,""))+'">Call</a>':'')+
        (l.mapsUri?'<a href="'+esc(l.mapsUri)+'" target="_blank" rel="noopener">Google</a>':'')+
        '<button onclick="saveLead('+idx+')" id="s'+idx+'">Save as lead</button>'+
        '<button onclick="consentPanel('+idx+')" id="k'+idx+'">Got consent</button>'+
        '<button class="signup" onclick="signThemUp('+idx+')">Sign up now</button>'+
      '</div>'+
      statusPills(l,idx)+
      '<div id="cons'+idx+'"></div>'+
      '<div id="d'+idx+'"></div>'+
    '</div>';
  }).join("");
}

async function details(i){
  var l=POOL[i], box=document.getElementById("d"+i);
  box.innerHTML='<div class="spin">Loading reviews…</div>';
  try{
    var d=await api({action:"details",placeId:l.placeId,pool:POOL});
    if(!d) return;
    var revs=(d.reviews||[]).slice(0,5);
    var c=d.competitors;
    var comp="";
    if(c){
      comp='<div class="gap"><b>'+ordinal(c.rank)+' of '+c.of+'</b> similar businesses nearby.'+
        (c.best?' Best: <b>'+esc(c.best.name)+'</b> — '+c.best.rating+'★, '+c.best.reviewCount+' reviews'+
          (c.best.multiple?' ('+c.best.multiple+'× yours)':'')+'.':'')+'</div>';
    }
    var rv=revs.length
      ? '<div class="rev">'+revs.map(function(r){
          var badOne=(r.rating||5)<=3;
          return '<div class="r'+(badOne?' bad':'')+'"><b>'+(r.rating||"?")+'★</b> <span class="w">'+esc(r.when)+'</span><br>'+esc((r.text||"(no text)").slice(0,220))+'</div>';
        }).join("")+'<div class="note">Live from Google — shown here only, never saved.</div></div>'
      : '<div class="note" style="margin-top:9px;">No review text available.</div>';
    box.innerHTML=comp+rv;
  }catch(e){ box.innerHTML='<div class="note">Couldn\'t load: '+esc(e.message)+'</div>'; }
}
function ordinal(n){ var s=["th","st","nd","rd"],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

// Save only the durable, non-personal facts. No review text, no competitor data
// — both go stale and both are somebody else's personal data.
// ---- doorstep consent ----------------------------------------------------
// Consent is given HERE, in the doorway, not back at a desk that evening. PECR
// consent has to be specific, informed and evidenced — and every ICO penalty on
// record comes down to an organisation that couldn't produce the evidence.
//
// So the panel shows the exact words to say, and the record is written server-
// side with the script version stamped in. Nothing here is a substitute for
// actually reading it out.
var CONSENT_SCRIPT_V = "v1";
// Ids must match CONSENT_CHANNELS in leads.js; labels are how they read.
var CONSENT_CHANNELS=[{id:"email",label:"Email"},{id:"whatsapp",label:"WhatsApp"},
                      {id:"sms",label:"SMS"},{id:"phone",label:"Phone"}];
var CONSENT_WORDS =
  "I'm from Trey. Trey is a tap-to-review stand that helps you get more Google "+
  "reviews, and drafts your replies for you. Is it alright if I follow up about "+
  "Trey by the ways you've ticked? We won't pass your details to anyone else, "+
  "every message will say it's from Trey, and you can stop them any time by "+
  "replying STOP or clicking unsubscribe.";

function consentPanel(i){
  var box=document.getElementById("cons"+i);
  if(!box) return;
  if(box.innerHTML){ box.innerHTML=""; return; }   // tap again to close
  var l=POOL[i];
  box.innerHTML=
    '<div class="cbox">'+
      '<div class="clab">Read this out — then tick what they agreed to</div>'+
      '<div class="cscript">'+esc(CONSENT_WORDS)+'</div>'+
      '<div class="cchan">'+
        CONSENT_CHANNELS.map(function(c){
          return '<label><input type="checkbox" id="ch_'+i+'_'+c.id+'" /> '+c.label+'</label>';
        }).join('')+
      '</div>'+
      '<input class="cin" id="cg'+i+'" placeholder="Who agreed? e.g. Dave, owner" autocomplete="off" />'+
      '<input class="cin" id="ct'+i+'" placeholder="Your name" value="'+esc(runnerName())+'" autocomplete="off" />'+
      '<button class="prim cbtn" onclick="saveConsent('+i+')">Record consent</button>'+
      '<div class="cnote" id="cmsg'+i+'">Only tick what they actually said yes to. '+
        'This is the evidence if anyone ever asks.</div>'+
    '</div>';
}

// Remembered between doors so it isn't retyped at every shop.
function runnerName(){ return localStorage.getItem("treyRunner")||""; }

async function saveConsent(i){
  var l=POOL[i], msg=document.getElementById("cmsg"+i);
  var channels=CONSENT_CHANNELS.map(function(c){ return c.id; }).filter(function(c){
    var b=document.getElementById("ch_"+i+"_"+c); return b&&b.checked;
  });
  var givenBy=document.getElementById("cg"+i).value.trim();
  var takenBy=document.getElementById("ct"+i).value.trim();
  if(takenBy) localStorage.setItem("treyRunner",takenBy);
  if(!channels.length||!givenBy||!takenBy){
    msg.className="cnote bad";
    msg.textContent="Need at least one channel, their name, and yours — an incomplete record is worse than none.";
    return;
  }
  msg.className="cnote"; msg.textContent="Saving…";
  try{
    var r=await fetch(LEADS_API,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({consent:{
        scriptVersion:CONSENT_SCRIPT_V, channels:channels,
        givenBy:givenBy, takenBy:takenBy, method:"verbal, in person",
        where:l.address||"",
        lead:{ placeId:l.placeId, businessName:l.businessName, category:l.category,
               phone:l.phone, website:l.website, address:l.address,
               source:"field walk "+new Date().toISOString().slice(0,10) }
      }})});
    var d=await r.json().catch(function(){ return {}; });
    if(!r.ok) throw new Error(d.error||("HTTP "+r.status));
    l.marketingConsent=true; l.legalStatus="consented";
    msg.className="cnote good";
    msg.textContent="Recorded — "+channels.join(", ")+" now open for "+l.businessName+".";
    var btn=document.getElementById("s"+i);
    if(btn){ btn.disabled=true; btn.textContent="Saved ✓"; }
    var chip=document.getElementById("pec"+i);
    if(chip){ chip.className="tag ok"; chip.textContent="consented · can message"; }
  }catch(e){
    msg.className="cnote bad"; msg.textContent=e.message;
  }
}

async function saveLead(i){
  var l=POOL[i], btn=document.getElementById("s"+i);
  btn.disabled=true; btn.textContent="Saving…";
  try{
    var r=await fetch(LEADS_API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({lead:{
        placeId:l.placeId, businessName:l.businessName, category:l.category,
        rating:l.rating, reviewCount:l.reviewCount, phone:l.phone, website:l.website,
        address:l.address, outreachStatus:"New",
        // We already have these in memory, so storing them costs nothing and is
        // what puts the lead on the planning map back at the desk. leads.js
        // stamps geoAt and deletes them again after 30 days — Google's limit.
        lat:l.lat, lng:l.lng,
        source:"field walk "+new Date().toISOString().slice(0,10)
      }})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    btn.textContent="Saved ✓";
  }catch(e){ btn.disabled=false; btn.textContent="Retry save"; }
}
</script>
