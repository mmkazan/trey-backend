<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trey | Add a Client</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a;
    --muted: #64748b; --accent: #059669; --accent-hover: #047857; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
  #tokenGate { max-width: 420px; margin: 80px auto; text-align: center; padding: 0 20px; }
  #tokenGate .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  header { position: sticky; top: 0; background: rgba(248,250,252,0.9); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 8px; z-index: 10; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 20px 60px; }
  h1 { font-size: 20px; margin: 4px 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #334155; margin-top: 14px; margin-bottom: 4px; }
  label .req { color: var(--accent); }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px; background: white; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(5,150,105,0.15); }
  .err { border-color: var(--danger) !important; }
  .err-msg { color: var(--danger); font-size: 12px; margin-top: 4px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .segmented { display: flex; border: 1px solid var(--border); border-radius: 10px; background: #f1f5f9; padding: 3px; margin-top: 4px; }
  .segmented button { flex: 1; border: none; background: transparent; padding: 9px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .segmented button.active { background: white; color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .consent { border: 1px solid var(--border); background: #f8fafc; border-radius: 12px; padding: 14px; margin-top: 18px; }
  .consent.err { background: #fef2f2; }
  .consent label { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; font-weight: 400; cursor: pointer; }
  .consent input { width: auto; margin-top: 2px; accent-color: var(--accent); }
  button.submit {
    width: 100%; margin-top: 20px; background: var(--accent); color: white; border: none;
    border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button.submit:hover { background: var(--accent-hover); }
  button.submit:disabled { opacity: 0.6; cursor: default; }
  #status { font-size: 13px; margin-top: 10px; min-height: 18px; text-align: center; }
  #status.error { color: var(--danger); }
  #status.success { display: none; }

  #successOverlay {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5);
    align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  #successOverlay.show { display: flex; }
  .successCard {
    background: white; border-radius: 20px; padding: 36px 28px; max-width: 360px; width: 100%;
    text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  }
  .successIcon {
    width: 72px; height: 72px; border-radius: 50%; background: #dcfce7;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 36px;
  }
  .successCard h2 { margin: 0 0 6px; font-size: 20px; color: var(--text); }
  .successCard p { margin: 0 0 26px; font-size: 14px; color: var(--muted); }
  .successCard button {
    width: 100%; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600;
    border: none; cursor: pointer; margin-bottom: 10px;
  }
  .btn-primary-lg { background: var(--accent); color: white; }
  .btn-primary-lg:hover { background: var(--accent-hover); }
  .btn-secondary-lg { background: #f1f5f9; color: var(--text); }
</style>
</head>
<body>

<div id="tokenGate">
  <div class="card">
    <h1>Trey — Add a Client</h1>
    <p class="sub">Enter your admin token to continue.</p>
    <input type="password" id="tokenInput" placeholder="Admin token" />
    <button class="submit" onclick="saveToken()">Enter</button>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="logo">✨</div>
    <strong>Trey</strong>
  </header>
  <main>
    <h1>Add a client</h1>
    <p class="sub">Every field is required before a client can be added.</p>

    <form id="onboardForm" onsubmit="return false;">
      <div class="row2">
        <div>
          <label>First name<span class="req"> *</span></label>
          <input id="f_firstName" />
          <div class="err-msg" id="e_firstName"></div>
        </div>
        <div>
          <label>Surname<span class="req"> *</span></label>
          <input id="f_surname" />
          <div class="err-msg" id="e_surname"></div>
        </div>
      </div>

      <label>WhatsApp number<span class="req"> *</span></label>
      <input id="f_phone" placeholder="+44 7941 052034" inputmode="tel" value="+44 " />
      <div class="hint">Where review alerts get sent</div>
      <div class="err-msg" id="e_phone"></div>

      <label>Email<span class="req"> *</span></label>
      <input id="f_email" placeholder="owner@business.com" />
      <div class="err-msg" id="e_email"></div>

      <label>Business name<span class="req"> *</span></label>
      <input id="f_businessName" />
      <div class="err-msg" id="e_businessName"></div>

      <label>Business type<span class="req"> *</span></label>
      <input id="f_businessType" placeholder="e.g. MOT garage" />
      <div class="err-msg" id="e_businessType"></div>

      <div class="row2">
        <div>
          <label>Current Google rating<span class="req"> *</span></label>
          <input id="f_googleRating" placeholder="4.5" inputmode="decimal" />
          <div class="err-msg" id="e_googleRating"></div>
        </div>
        <div>
          <label>Total review count<span class="req"> *</span></label>
          <input id="f_reviewCount" placeholder="56" inputmode="numeric" />
          <div class="err-msg" id="e_reviewCount"></div>
        </div>
      </div>

      <label>Google Location ID<span class="req"> *</span></label>
      <input id="f_locationId" placeholder="locations/12345 or loc_business_123" />
      <div class="hint">From the business's Google Business Profile</div>
      <div class="err-msg" id="e_locationId"></div>

      <label>Google Account ID<span class="req"> *</span></label>
      <input id="f_googleAccountId" />
      <div class="err-msg" id="e_googleAccountId"></div>

      <label>Reply voice</label>
      <div class="segmented">
        <button type="button" id="voice_Individual" class="active" onclick="setVoice('Individual')">Individual (I/my/me)</button>
        <button type="button" id="voice_Company" onclick="setVoice('Company')">Company (we/our/us)</button>
      </div>

      <label>Public sign-off name<span class="req"> *</span></label>
      <input id="f_publicSignOffName" placeholder="e.g. Mik" />
      <div class="hint">Name shown at the end of AI replies</div>
      <div class="err-msg" id="e_publicSignOffName"></div>

      <div class="consent" id="consentBox">
        <label>
          <input type="checkbox" id="f_terms" />
          <span>I agree to Trey's Terms of Service and Privacy Policy, and consent to Trey processing this business's review data and sending WhatsApp notifications on its behalf. I understand our 14-day free trial starts today, and that the NFC/QR tap stand landing page will automatically pause unless a subscription is set up via the billing link provided.</span>
        </label>
        <div class="err-msg" id="e_terms" style="margin-left:26px;"></div>
      </div>

      <button class="submit" id="submitBtn" onclick="handleSave()">Add client</button>
      <div id="status"></div>
    </form>
  </main>
</div>

<script>
  const API = "/.netlify/functions/client";
  let token = sessionStorage.getItem("treyAdminToken") || "";
  let voicePerspective = "Individual";

  function saveToken() {
    const val = document.getElementById("tokenInput").value.trim();
    if (!val) return;
    token = val;
    sessionStorage.setItem("treyAdminToken", val);
    boot();
  }

  function boot() {
    document.getElementById("tokenGate").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  if (token) boot();

  function setVoice(v) {
    voicePerspective = v;
    document.getElementById("voice_Individual").classList.toggle("active", v === "Individual");
    document.getElementById("voice_Company").classList.toggle("active", v === "Company");
  }

  function formatUKPhone(raw) {
    let digits = raw.replace(/[^\d+]/g, "");
    digits = digits.replace(/^\+/, "");
    if (digits.startsWith("44")) digits = digits.slice(2);
    else if (digits.startsWith("0")) digits = digits.slice(1);
    return "+44" + (digits ? " " + digits : " ");
  }
  document.getElementById("f_phone").addEventListener("input", (e) => {
    const pos = e.target.selectionStart;
    e.target.value = formatUKPhone(e.target.value);
  });

  function clearErrors() {
    ["firstName","surname","phone","email","businessName","businessType","googleRating","reviewCount","locationId","googleAccountId","publicSignOffName","terms"]
      .forEach((k) => {
        const el = document.getElementById("e_" + k);
        if (el) el.textContent = "";
        const input = document.getElementById("f_" + k);
        if (input) input.classList.remove("err");
      });
    document.getElementById("consentBox").classList.remove("err");
  }

  function setErr(key, msg) {
    document.getElementById("e_" + key).textContent = msg;
    const input = document.getElementById("f_" + key);
    if (input) input.classList.add("err");
    if (key === "terms") document.getElementById("consentBox").classList.add("err");
  }

  function setStatus(msg, type) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = type || "";
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  function validate() {
    clearErrors();
    let ok = true;
    const req = (key, id) => { if (!val(id)) { setErr(key, "Required"); ok = false; } };
    req("firstName", "f_firstName");
    req("surname", "f_surname");
    if (!val("f_phone")) { setErr("phone", "Required"); ok = false; }
    else if (!/^\+?[0-9\s]{8,}$/.test(val("f_phone"))) { setErr("phone", "Use a valid number"); ok = false; }
    if (!val("f_email")) { setErr("email", "Required"); ok = false; }
    else if (!/^\S+@\S+\.\S+$/.test(val("f_email"))) { setErr("email", "Enter a valid email"); ok = false; }
    req("businessName", "f_businessName");
    req("businessType", "f_businessType");
    const rating = val("f_googleRating");
    if (!rating) { setErr("googleRating", "Required"); ok = false; }
    else if (isNaN(rating) || rating < 0 || rating > 5) { setErr("googleRating", "Enter 0–5"); ok = false; }
    const count = val("f_reviewCount");
    if (!count) { setErr("reviewCount", "Required"); ok = false; }
    else if (isNaN(count) || count < 0) { setErr("reviewCount", "Enter a valid count"); ok = false; }
    req("locationId", "f_locationId");
    req("googleAccountId", "f_googleAccountId");
    req("publicSignOffName", "f_publicSignOffName");
    if (!document.getElementById("f_terms").checked) { setErr("terms", "You must accept to continue"); ok = false; }
    return ok;
  }

  function addAnother() {
    document.getElementById("successOverlay").classList.remove("show");
    document.getElementById("f_firstName").focus();
  }

  async function handleSave() {
    if (!validate()) return;
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    setStatus("Saving…", "");
    const payload = {
      token,
      locationId: val("f_locationId"),
      firstName: val("f_firstName"),
      surname: val("f_surname"),
      phone: val("f_phone"),
      email: val("f_email"),
      businessName: val("f_businessName"),
      businessType: val("f_businessType"),
      googleRating: val("f_googleRating"),
      reviewCount: val("f_reviewCount"),
      googleAccountId: val("f_googleAccountId"),
      voicePerspective,
      publicSignOffName: val("f_publicSignOffName"),
      termsAccepted: true,
      termsAcceptedAt: new Date().toISOString(),
    };
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (res.status === 403) {
        setStatus("Admin token rejected — please re-enter.", "error");
        sessionStorage.removeItem("treyAdminToken");
        token = "";
        document.getElementById("app").style.display = "none";
        document.getElementById("tokenGate").style.display = "block";
        return;
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
      }
      document.getElementById("successSub").textContent = `${payload.businessName} has been added to Trey.`;
      document.getElementById("successOverlay").classList.add("show");
      document.getElementById("onboardForm").reset();
      document.getElementById("f_phone").value = "+44 ";
      setVoice("Individual");
    } catch (e) {
      setStatus(`Couldn't save: ${e.message}`, "error");
    } finally {
      btn.disabled = false;
    }
  }
</script>

<div id="successOverlay">
  <div class="successCard">
    <div class="successIcon">✅</div>
    <h2 id="successTitle">Client added</h2>
    <p id="successSub">has been added to Trey.</p>
    <button class="btn-primary-lg" onclick="addAnother()">Add another client</button>
    <button class="btn-secondary-lg" onclick="location.href='/admin.html'">Return to Trey Admin</button>
  </div>
</div>

</body>
</html>
