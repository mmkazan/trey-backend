<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trey Admin | Clients</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #16a34a;
    --accent-hover: #15803d;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  header .sub {
    color: var(--muted);
    font-size: 13px;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px 0;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-header h2 { margin: 0; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 16px;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  button {
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: #f1f5f9;
    color: var(--text);
  }
  .btn-danger {
    background: #fef2f2;
    color: var(--danger);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 600; }
  tr:hover { background: #f8fafc; cursor: pointer; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    background: #f0fdf4;
    color: #166534;
  }
  #status {
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }
  #status.error { color: var(--danger); }
  #status.success { color: var(--accent); }
  #tokenGate {
    max-width: 420px;
    margin: 80px auto;
    text-align: center;
  }
  .muted-link {
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  /* Detail view */
  .detailGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 24px;
    margin-bottom: 16px;
  }
  .detailGrid .field label {
    margin-top: 0;
    margin-bottom: 2px;
  }
  .detailGrid .field .val {
    font-size: 14px;
    color: var(--text);
  }
  .detailGrid .field .val.empty { color: #cbd5e1; }
</style>
</head>
<body>

<div id="tokenGate" class="card">
  <h2>Trey Admin</h2>
  <label for="tokenInput">Admin token</label>
  <input type="password" id="tokenInput" placeholder="Paste your CLIENT_ADMIN_TOKEN" />
  <div class="actions">
    <button class="btn-primary" onclick="saveToken()">Enter</button>
  </div>
  <p id="gateStatus" class="muted"></p>
</div>

<div id="app" style="display:none;">
  <header>
    <div>
      <h1>Trey Admin — Clients</h1>
      <div class="sub">Clients, trials &amp; monthly tap activity</div>
    </div>
    <span class="muted-link" onclick="logout()">Sign out</span>
  </header>

  <main>
    <div class="card" id="formCard" style="display:none;">
      <div class="card-header">
        <h2 id="formTitle">Add a client</h2>
        <span class="muted-link" onclick="hideForm()">Close</span>
      </div>
      <div class="grid">
        <div>
          <label>Location ID *</label>
          <input id="f_locationId" placeholder="e.g. loc_derby_101" />
        </div>
        <div>
          <label>Business name</label>
          <input id="f_businessName" placeholder="e.g. Mik'S Cars" />
        </div>
        <div>
          <label>Business type</label>
          <input id="f_businessType" placeholder="e.g. MOT" />
        </div>
        <div>
          <label>WhatsApp number</label>
          <input id="f_phone" placeholder="+447941052034" />
        </div>
        <div>
          <label>Email</label>
          <input id="f_email" placeholder="owner@business.com" />
        </div>
        <div>
          <label>Google Account ID</label>
          <input id="f_googleAccountId" placeholder="Google Business account ID" />
        </div>
        <div>
          <label>Google Place ID</label>
          <input id="f_placeId" placeholder="ChIJ… (for monthly rating sync)" />
        </div>
        <div>
          <label>Business logo URL</label>
          <input id="f_logoUrl" placeholder="https://… (thank-you screen &amp; reports)" />
        </div>
        <div>
          <label>Voice perspective</label>
          <select id="f_voicePerspective">
            <option value="Individual">Individual (I/my/me)</option>
            <option value="Company">Company (we/our/us)</option>
          </select>
        </div>
        <div>
          <label>Public sign-off name</label>
          <input id="f_publicSignOffName" placeholder="e.g. Mik" />
        </div>
        <div>
          <label>Subscription status</label>
          <select id="f_subscriptionStatus">
            <option value="trial">Trial (14-day)</option>
            <option value="active">Active (paid)</option>
            <option value="paused">Paused</option>
          </select>
        </div>
        <div>
          <label>Google rating at sign-up</label>
          <input id="f_initialGoogleRating" type="number" step="0.1" min="0" max="5" placeholder="e.g. 4.3" />
        </div>
        <div>
          <label>Review count at sign-up</label>
          <input id="f_initialReviewCount" type="number" min="0" placeholder="e.g. 118" />
        </div>
        <div>
          <label>Google rating now</label>
          <input id="f_googleRating" type="number" step="0.1" min="0" max="5" placeholder="auto-syncs monthly" />
        </div>
        <div>
          <label>Review count now</label>
          <input id="f_reviewCount" type="number" min="0" placeholder="auto-syncs monthly" />
        </div>
      </div>
      <div class="actions">
        <button class="btn-primary" onclick="saveClient()">Save client</button>
        <button class="btn-secondary" onclick="resetForm()">Clear form</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="card" id="detailCard" style="display:none;">
      <div class="card-header">
        <h2 id="detailTitle">Client details</h2>
        <span class="muted-link" onclick="hideDetail()">Close</span>
      </div>
      <div class="detailGrid" id="detailGrid"></div>
      <div class="actions">
        <button class="btn-primary" onclick="editFromDetail()">Edit client</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>All clients</h2>
        <button class="btn-primary" onclick="openAddForm()">+ Add new client</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Location ID</th>
            <th>Business</th>
            <th>WhatsApp</th>
            <th>Taps</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="clientRows">
          <tr><td colspan="5" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const API = "/.netlify/functions/client";
  let token = sessionStorage.getItem("treyAdminToken") || "";
  let clientsCache = [];

  // Escape any value before putting it into innerHTML (incl. quotes for
  // attribute contexts). Prevents a stored value like "<img onerror=…>" from
  // executing when the client list/detail renders.
  const esc = (v) => { v = (v == null ? "" : String(v)); const d = document.createElement("div"); d.textContent = v; return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;"); };

  function saveToken() {
    const val = document.getElementById("tokenInput").value.trim();
    if (!val) return;
    token = val;
    sessionStorage.setItem("treyAdminToken", val);
    boot();
  }

  function logout() {
    sessionStorage.removeItem("treyAdminToken");
    token = "";
    document.getElementById("app").style.display = "none";
    document.getElementById("tokenGate").style.display = "block";
  }

  function setStatus(msg, type) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = type || "";
  }

  function resetForm() {
    ["locationId", "businessName", "businessType", "phone", "email", "googleAccountId", "publicSignOffName",
     "placeId", "logoUrl", "initialGoogleRating", "initialReviewCount", "googleRating", "reviewCount"]
      .forEach((k) => document.getElementById("f_" + k).value = "");
    document.getElementById("f_voicePerspective").value = "Individual";
    document.getElementById("f_subscriptionStatus").value = "trial";
    document.getElementById("f_locationId").disabled = false;
    document.getElementById("formTitle").textContent = "Add a client";
    setStatus("", "");
  }

  function showForm() {
    document.getElementById("detailCard").style.display = "none";
    document.getElementById("formCard").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function hideForm() {
    document.getElementById("formCard").style.display = "none";
  }

  function openAddForm() {
    resetForm();
    showForm();
  }

  function hideDetail() {
    document.getElementById("detailCard").style.display = "none";
  }

  const DETAIL_FIELDS = [
    ["Business name", "businessName"],
    ["Business type", "businessType"],
    ["WhatsApp number", "phone"],
    ["Email", "email"],
    ["Google rating at sign-up", "initialGoogleRating"],
    ["Google rating now", "googleRating"],
    ["Rating change", "_ratingChange"],
    ["Reviews at sign-up", "initialReviewCount"],
    ["Reviews now", "reviewCount"],
    ["New reviews since sign-up", "_reviewChange"],
    ["Google Location ID", "locationId"],
    ["Google Account ID", "googleAccountId"],
    ["Google Place ID", "placeId"],
    ["Business logo URL", "logoUrl"],
    ["Voice perspective", "voicePerspective"],
    ["Public sign-off name", "publicSignOffName"],
    ["Subscription", "subscriptionStatus"],
    ["Taps since sign-up", "tapsSinceSignup"],
    ["Taps this month", "tapsThisMonth"],
    ["Taps this week", "tapsThisWeek"],
    ["Reviews via Trey (this week)", "tapReviewsThisWeek"],
    ["Reviews direct (this week)", "organicReviewsThisWeek"],
    ["Reviews via tap (all time)", "tapReviews"],
    ["Reviews organic (all time)", "organicReviews"],
  ];

  function num(v) {
    return v === "" || v === null || v === undefined || isNaN(Number(v)) ? null : Number(v);
  }

  function showDetail(c) {
    document.getElementById("formCard").style.display = "none";
    document.getElementById("detailTitle").textContent = c.businessName || c.locationId;
    const cc = { ...c };
    const ir = num(c.initialGoogleRating), nr = num(c.googleRating);
    if (ir !== null && nr !== null) {
      const d = nr - ir;
      cc._ratingChange = (d > 0 ? "+" : "") + d.toFixed(2) + " ★";
    }
    const ic = num(c.initialReviewCount), nc = num(c.reviewCount);
    if (ic !== null && nc !== null) {
      const d = nc - ic;
      cc._reviewChange = (d > 0 ? "+" : "") + d;
    }
    const STAR_KEYS = new Set(["initialGoogleRating", "googleRating"]);
    document.getElementById("detailGrid").innerHTML = DETAIL_FIELDS.map(([label, key]) => {
      const v = cc[key];
      const has = v !== undefined && v !== null && v !== "";
      const display = has ? (STAR_KEYS.has(key) ? `${esc(v)} ★` : esc(v)) : "Not set";
      return `
      <div class="field">
        <label>${esc(label)}</label>
        <div class="val ${has ? "" : "empty"}">${display}</div>
      </div>`;
    }).join("");
    document.getElementById("detailCard").dataset.locationId = c.locationId;
    document.getElementById("detailCard").style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function editFromDetail() {
    const locationId = document.getElementById("detailCard").dataset.locationId;
    const c = clientsCache.find((x) => x.locationId === locationId);
    if (c) editClient(c);
  }

  async function loadClients() {
    const rowsEl = document.getElementById("clientRows");
    rowsEl.innerHTML = '<tr><td colspan="5" class="muted">Loading…</td></tr>';
    try {
      const res = await fetch(API, { headers: { Authorization: "Bearer " + token } });
      if (res.status === 403) { logout(); return; }
      const clients = await res.json();
      clientsCache = Array.isArray(clients) ? clients : [];
      if (clientsCache.length === 0) {
        rowsEl.innerHTML = '<tr><td colspan="5" class="muted">No clients yet.</td></tr>';
        return;
      }
      rowsEl.innerHTML = clientsCache.map((c, i) => `
        <tr onclick="showDetail(clientsCache[${i}])">
          <td>${esc(c.locationId || "")}</td>
          <td>${esc(c.businessName || "")}<br><span class="muted" style="font-size:11px;">${esc(c.businessType || "")}</span></td>
          <td>${c.phone ? esc(c.phone) : '<span class="muted">—</span>'}</td>
          <td>${esc(c.tapsSinceSignup || 0)} <span class="muted" style="font-size:11px;">(${esc(c.tapsThisMonth || 0)} this mo)</span></td>
          <td><span class="muted-link" onclick='event.stopPropagation(); editClient(clientsCache[${i}])'>Edit</span></td>
        </tr>
      `).join("");
    } catch (err) {
      rowsEl.innerHTML = `<tr><td colspan="5" class="muted">Failed to load: ${esc(err.message)}</td></tr>`;
    }
  }

  function editClient(c) {
    document.getElementById("f_locationId").value = c.locationId || "";
    document.getElementById("f_locationId").disabled = true;
    document.getElementById("f_businessName").value = c.businessName || "";
    document.getElementById("f_businessType").value = c.businessType || "";
    document.getElementById("f_phone").value = c.phone || "";
    document.getElementById("f_email").value = c.email || "";
    document.getElementById("f_googleAccountId").value = c.googleAccountId || "";
    document.getElementById("f_placeId").value = c.placeId || "";
    document.getElementById("f_logoUrl").value = c.logoUrl || "";
    document.getElementById("f_voicePerspective").value = c.voicePerspective || "Individual";
    document.getElementById("f_publicSignOffName").value = c.publicSignOffName || "";
    // No status recorded = grandfathered active; show that so a save keeps them on.
    document.getElementById("f_subscriptionStatus").value = c.subscriptionStatus || "active";
    document.getElementById("f_initialGoogleRating").value = c.initialGoogleRating ?? "";
    document.getElementById("f_initialReviewCount").value = c.initialReviewCount ?? "";
    document.getElementById("f_googleRating").value = c.googleRating ?? "";
    document.getElementById("f_reviewCount").value = c.reviewCount ?? "";
    document.getElementById("formTitle").textContent = "Edit client";
    showForm();
  }

  async function saveClient() {
    const locationId = document.getElementById("f_locationId").value.trim();
    if (!locationId) {
      setStatus("Location ID is required.", "error");
      return;
    }
    const numOrEmpty = (id) => {
      const v = document.getElementById(id).value.trim();
      return v === "" ? "" : Number(v);
    };
    const payload = {
      token,
      locationId,
      businessName: document.getElementById("f_businessName").value.trim(),
      businessType: document.getElementById("f_businessType").value.trim(),
      phone: document.getElementById("f_phone").value.trim(),
      email: document.getElementById("f_email").value.trim(),
      googleAccountId: document.getElementById("f_googleAccountId").value.trim(),
      placeId: document.getElementById("f_placeId").value.trim(),
      logoUrl: document.getElementById("f_logoUrl").value.trim(),
      voicePerspective: document.getElementById("f_voicePerspective").value,
      publicSignOffName: document.getElementById("f_publicSignOffName").value.trim(),
      subscriptionStatus: document.getElementById("f_subscriptionStatus").value,
      initialGoogleRating: numOrEmpty("f_initialGoogleRating"),
      initialReviewCount: numOrEmpty("f_initialReviewCount"),
      googleRating: numOrEmpty("f_googleRating"),
      reviewCount: numOrEmpty("f_reviewCount"),
    };
    setStatus("Saving…", "");
    try {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (res.status === 403) { logout(); return; }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `HTTP ${res.status}`);
      }
      resetForm();
      hideForm();
      loadClients();
    } catch (err) {
      setStatus(`Failed to save: ${err.message}`, "error");
    }
  }

  function boot() {
    document.getElementById("tokenGate").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadClients();
  }

  if (token) {
    boot();
  }
</script>

</body>
</html>
