    DRAFT_STATE={ phone:waNumber(l.phone), email:(l.email||"").trim() };
    const waAct=id=>'<button class="copybtn" onclick="copyTa(\''+id+'\',this)">Copy</button>'+(DRAFT_STATE.phone?' <button class="linkbtn" onclick="openWa(\''+id+'\')">Open WhatsApp</button>':'');
    const emAct=(s,b)=>'<button class="copybtn" onclick="copyTa(\''+b+'\',this)">Copy body</button>'+(DRAFT_STATE.email?' <button class="linkbtn" onclick="composeEmail(\''+s+'\',\''+b+'\')">Compose</button>':'');
    const waBlock=(label,id)=>'<div class="msgblock"><div class="mhead"><span class="mlabel">'+label+'</span><span>'+waAct(id)+'</span></div><textarea id="'+id+'"></textarea></div>';
    const emBlock=(label,s,b)=>'<div class="msgblock"><div class="mhead"><span class="mlabel">'+label+'</span><span>'+emAct(s,b)+'</span></div><label style="margin:0 0 4px;">Subject</label><input id="'+s+'"/><label>Body</label><textarea id="'+b+'"></textarea></div>';
    const subline=d.hasHook?('Leading with the '+d.hook.stars+'★ from '+d.hook.month):'No unanswered review on file — using the “more reviews” angle.';
    const html='<div class="modal">'+
      '<span class="modal-close" onclick="closeDraft()">×</span>'+
      '<h3>Draft outreach — '+esc(l.businessName||"(no name)")+'</h3>'+
      '<div class="msub">'+esc(subline)+' · everything below is editable before you send.</div>'+
      '<div class="senderbox"><div style="font-size:12px;color:#475569;font-weight:700;margin-bottom:6px;">Your details — saved on this device, used in every draft</div>'+
        '<div class="row">'+
          '<div><label>Your name</label><input id="out_sender" value="'+esc(OUT.get("sender",""))+'"/></div>'+
          '<div><label>Your contact (phone / email / site)</label><input id="out_contact" value="'+esc(OUT.get("contact",""))+'"/></div>'+
          '<div><label>Demo / booking link</label><input id="out_demo" value="'+esc(OUT.get("demo",""))+'"/></div>'+
        '</div>'+
        '<div style="margin-top:8px;"><button class="btn-secondary" onclick="regenDraft('+i+')">↻ Apply my details</button></div>'+
      '</div>'+
      '<div class="chanhdr">WhatsApp / SMS</div>'+
      waBlock("First touch","wa_1")+waBlock("Follow-up (2–3 days)","wa_2")+waBlock("Final touch (4–5 days)","wa_3")+
      '<div class="chanhdr">Email</div>'+
      emBlock("First touch","em_sub_1","em_body_1")+emBlock("Follow-up (3–4 days)","em_sub_2","em_body_2")+emBlock("Final touch (5–7 days)","em_sub_3","em_body_3")+
    '</div>';
    const m=document.getElementById("draftModal"); m.innerHTML=html; m.style.display="block";
    val("wa_1",d.wa1); val("wa_2",d.wa2); val("wa_3",d.wa3);
    val("em_sub_1",d.emSub1); val("em_body_1",d.emBody1);
    val("em_sub_2",d.emSub2); val("em_body_2",d.emBody2);
    val("em_sub_3",d.emSub3); val("em_body_3",d.emBody3);
  }
  function val(id,v){ const e=document.getElementById(id); if(e) e.value=v; }
  function closeDraft(){ const m=document.getElementById("draftModal"); m.style.display="none"; m.innerHTML=""; }
  function saveOut(){ const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";}; OUT.set("sender",g("out_sender")); OUT.set("contact",g("out_contact")); OUT.set("demo",g("out_demo")); }
  function regenDraft(i){ saveOut(); openDraft(i); }
  function copyTa(id,btn){
    const e=document.getElementById(id); if(!e) return;
    const done=function(){ if(btn){ const o=btn.textContent; btn.textContent="Copied ✓"; btn.classList.add("ok"); setTimeout(function(){ btn.textContent=o; btn.classList.remove("ok"); },1400); } };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(e.value).then(done).catch(fb); } else { fb(); }
    function fb(){ e.focus(); e.select(); try{ document.execCommand("copy"); done(); }catch(_){} }
  }
  function openWa(id){ const e=document.getElementById(id); if(!e||!DRAFT_STATE.phone) return; window.open("https://wa.me/"+DRAFT_STATE.phone+"?text="+encodeURIComponent(e.value),"_blank"); }
  function composeEmail(s,b){ const se=document.getElementById(s), be=document.getElementById(b); const sub=se?se.value:"", body=be?be.value:""; window.location.href="mailto:"+DRAFT_STATE.email+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body); }

  function boot(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; loadLeads(); }
  if(token) boot();
</script>
</body>
</html>
