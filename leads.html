<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trey Leads</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{--bg:#eef3fc;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#4f46e5;--accent2:#4338ca;--danger:#dc2626;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:18px;margin:0;}
  header .sub{color:var(--muted);font-size:13px;}
  a.nav,.muted-link{color:var(--muted);font-size:13px;text-decoration:none;cursor:pointer;}
  a.nav:hover{color:var(--text);}
  main{max-width:1000px;margin:0 auto;padding:22px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
  h2{font-size:15px;margin:0 0 12px;}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;}
  textarea{min-height:60px;resize:vertical;}
  button{border:none;border-radius:6px;padding:9px 16px;font-size:14px;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:#4338ca;}
  .btn-secondary{background:#f1f5f9;color:var(--text);}
  .btn-danger{background:#fef2f2;color:var(--danger);}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;}
  .row>div{flex:1;min-width:160px;}
  .counts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px;}
  .count{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:13px;}
  .count b{margin-right:5px;}
  .lead{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .lead-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;}
  .lead-head:hover{background:#f8fafc;}
  .tier{font-weight:800;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;}
  .t1{background:#dcfce7;color:#166534;}.t2{background:#fef9c3;color:#854d0e;}.t3{background:#f1f5f9;color:#475569;}
  .score{font-weight:800;font-size:16px;width:34px;text-align:center;}
  .lead-main{flex:1;min-width:0;}
  .lead-name{font-weight:600;font-size:15px;}
  .lead-sub{color:var(--muted);font-size:12px;}
  .pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;border:none;cursor:pointer;white-space:nowrap;}
  .s-New{background:#e2e8f0;color:#334155;}.s-Comeback{background:#ffedd5;color:#9a3412;}.s-Contacted{background:#dbeafe;color:#1e40af;}
  .s-Ontrial{background:#fef9c3;color:#854d0e;}.s-Converted{background:#dcfce7;color:#166534;}.s-Lost{background:#fee2e2;color:#991b1b;}
  .badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;}
  .b-client{background:#dcfce7;color:#166534;}.b-flag{background:#fee2e2;color:#991b1b;}.b-thin{background:#f1f5f9;color:#64748b;}
  .lead-detail{padding:0 16px 16px;border-top:1px solid var(--border);display:none;}
  /* PECR channel verdict. Deliberately loud — a wrong send here is a regulatory
     matter, not a typo. */
  .pecr{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12.5px;line-height:1.5;border:1px solid;}
  .pecr.open{background:#ecfdf5;border-color:#a7f3d0;color:#065f46;}
  .pecr.limited{background:#fffbeb;border-color:#fde68a;color:#92400e;}
  .pecr.blocked{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
  .chan{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-right:6px;border:1px solid;}
  .chan.yes{background:#fff;border-color:#a7f3d0;color:#047857;}
  .chan.no{background:#fff;border-color:#fecaca;color:#b91c1c;text-decoration:line-through;}
  .hook{background:#f8fafc;border-left:3px solid var(--accent2);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;margin:12px 0;color:#334155;}
  .tsbadge{display:inline-block;color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;white-space:nowrap;}
  .tshint{background:#eef2ff;border:1px solid #e0e7ff;border-radius:8px;padding:8px 11px;font-size:12.5px;color:#3730a3;margin:10px 0;line-height:1.45;}
  .opp{font-weight:800;font-size:12px;padding:4px 8px;border-radius:8px;white-space:nowrap;color:#fff;text-align:center;min-width:62px;line-height:1.15;}
  .opp b{display:block;font-size:14px;}
  .opp small{font-weight:700;font-size:9px;letter-spacing:.04em;opacity:.9;}
  .opphint{background:#f0fdf4;border:1px solid #dcfce7;border-radius:8px;padding:8px 11px;font-size:12.5px;color:#14532d;margin:10px 0;line-height:1.45;}
  .checkline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none;}
  .checkline input{width:auto;margin:0;}
  .reasons{font-size:12px;color:var(--muted);margin:6px 0 12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
  .statusbtns{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;}
  .statusbtns .pill{opacity:.55;}.statusbtns .pill.active{opacity:1;outline:2px solid rgba(0,0,0,.12);}
  #status{font-size:13px;margin-top:8px;min-height:16px;}
  #status.error{color:var(--danger);}#status.success{color:#16a34a;}
  .gate{max-width:420px;margin:80px auto;text-align:center;}
  .muted{color:var(--muted);font-size:13px;}
  a{color:var(--accent2);}
  .draft-pill{background:#eef2ff;color:#4338ca;}
  .draft-pill:hover{background:#e0e7ff;}
  /* Draft-outreach modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;padding:24px;overflow:auto;}
  .modal{max-width:680px;margin:0 auto;background:#fff;border-radius:14px;padding:22px 22px 26px;box-shadow:0 20px 60px rgba(15,23,42,.25);}
  .modal h3{margin:0;font-size:17px;}
  .modal .msub{color:var(--muted);font-size:12.5px;margin:4px 0 16px;}
  .modal-close{float:right;cursor:pointer;color:var(--muted);font-size:24px;line-height:.8;font-weight:400;}
  .senderbox{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .senderbox label{margin-top:0;}
  .chanhdr{font-weight:800;font-size:12px;letter-spacing:.6px;color:var(--accent2);margin:18px 0 8px;}
  .msgblock{border:1px solid var(--border);border-radius:10px;padding:10px 12px 12px;margin-bottom:10px;}
  .msgblock .mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;}
  .msgblock .mlabel{font-weight:700;font-size:13px;}
  .msgblock textarea{min-height:92px;font-size:13px;line-height:1.45;}
  .copybtn{background:#f1f5f9;color:#0f172a;padding:5px 11px;font-size:12px;border-radius:6px;}
  .copybtn.ok{background:#dcfce7;color:#166534;}
  .linkbtn{background:#eef2ff;color:#4338ca;padding:5px 11px;font-size:12px;border-radius:6px;border:none;cursor:pointer;}
  /* Planning map. Same dot mechanics as go.html — see map-pins.js. */
  /* Capped, or at full desktop width a 640x380 picture is ~800px tall and you
     scroll past the list to reach it. */
  .mapwrap{position:relative;line-height:0;margin-bottom:10px;max-width:820px;}
  .map{width:100%;border-radius:10px;border:1px solid #cfe0f6;display:block;}
  .pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;padding:0;
       border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(15,23,42,.5);
       color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;cursor:pointer;}
  /* Colour is TIER — how good a prospect — matching the tier filter beside the
     map and the bands in go.html. Colouring by pipeline status (the first
     version) made every dot green, because every lead starts as "New". */
  .pin.t1{background:#047857;} .pin.t2{background:#b45309;} .pin.t3{background:#94a3b8;}
  /* Status colours, matched to the .s-* pills so a dot and its row agree. */
  .pin.st-new{background:#94a3b8;} .pin.st-comeback{background:#ea580c;} .pin.st-contacted{background:#2563eb;}
  .pin.st-trial{background:#ca8a04;} .pin.st-converted{background:#16a34a;}
  .pin.st-lost{background:#dc2626;}
  .pin.mine{background:#4338ca;}
  .pin.lost{background:#cbd5e1;color:#64748b;border-color:#e2e8f0;}
  .pin.you{background:#4338ca;width:18px;height:18px;line-height:14px;font-size:10px;cursor:default;}
  .dim{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;
       background:#94a3b8;border:1.5px solid #fff;opacity:.5;}
  .maplegend{display:flex;gap:14px;font-size:12px;color:#64748b;margin:0 0 12px;flex-wrap:wrap;}
  .mapctl{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap;}
  .mapctl button{font-size:13px;font-weight:800;width:32px;height:32px;padding:0;border-radius:8px;
    border:1px solid #cfe0f6;background:#fff;color:#334155;cursor:pointer;}
  .mapctl button:disabled{opacity:.4;cursor:default;}
  .mapctl .lab{font-size:12px;color:#64748b;margin-left:4px;}
  .mapctl .colby{width:auto;padding:0 10px;font-size:12px;font-weight:700;}
  .mapctl .colby.on{background:#4338ca;color:#fff;border-color:#4338ca;}
  .maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
  .viewtog{display:flex;gap:6px;}
  .viewtog button{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;
       border:1px solid #e2e8f0;background:#fff;color:#475569;cursor:pointer;}
  .viewtog button.on{background:#4338ca;color:#fff;border-color:#4338ca;}
  .card.flash,.lead.flash{box-shadow:0 0 0 3px #a5b4fc;}
  .card,.lead{transition:box-shadow .25s;}
  .mapnote{font-size:12.5px;color:#64748b;margin-bottom:10px;line-height:1.5;}
  .mapnote b{color:#0f172a;}
</style>
</head>
<body>

<div id="gate" class="card gate">
  <svg viewBox="0 0 100 100" width="52" height="52" style="display:block;margin:0 auto 10px;" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="rotate(-20 50 50)"><path d="M21.7,83.7 A44,44 0 1 1 78.3,83.7" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round" opacity="0.28"/><path d="M28.8,75.3 A33,33 0 1 1 71.2,75.3" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round" opacity="0.55"/><path d="M35.85,66.85 A22,22 0 1 1 64.15,66.85" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round"/></g><rect x="37" y="39" width="26" height="8" rx="2" fill="#4338CA"/><rect x="46" y="39" width="8" height="25" rx="2" fill="#4338CA"/></svg>
  <h2>Trey Leads</h2>
  <label for="tokenInput">Admin token</label>
  <input type="password" id="tokenInput" placeholder="Your CLIENT_ADMIN_TOKEN" />
  <div style="margin-top:12px;"><button class="btn-primary" onclick="saveToken()">Enter</button></div>
</div>

<div id="app" style="display:none;">
  <header>
    <div style="display:flex;align-items:center;gap:12px;">
      <svg viewBox="0 0 100 100" width="36" height="36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="rotate(-20 50 50)"><path d="M21.7,83.7 A44,44 0 1 1 78.3,83.7" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round" opacity="0.28"/><path d="M28.8,75.3 A33,33 0 1 1 71.2,75.3" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round" opacity="0.55"/><path d="M35.85,66.85 A22,22 0 1 1 64.15,66.85" fill="none" stroke="#4338CA" stroke-width="5" stroke-linecap="round"/></g><rect x="37" y="39" width="26" height="8" rx="2" fill="#4338CA"/><rect x="46" y="39" width="8" height="25" rx="2" fill="#4338CA"/></svg>
      <div><h1>Trey Leads</h1><div class="sub">Scored prospects &amp; outreach pipeline</div></div>
    </div>
    <div><a class="nav" href="admin.html">← Clients</a> &nbsp;·&nbsp; <span class="muted-link" onclick="logout()">Sign out</span></div>
  </header>
  <main>
    <div class="card">
      <h2>Add leads</h2>
      <div class="row">
        <div style="flex:2;">
          <label>Quick add — business name</label>
          <input id="q_name" placeholder="e.g. Smith's Garage" onkeydown="if(event.key==='Enter')quickAdd()" />
        </div>
        <div style="flex:0;"><button class="btn-primary" onclick="quickAdd()">Add</button></div>
      </div>
      <label style="margin-top:16px;">Bulk upload — drop your Apify city export (or a Trey scored CSV)</label>
      <div class="row">
        <div style="flex:2;"><input type="file" id="csvFile" accept=".csv" /></div>
        <div style="flex:0;"><button class="btn-primary" onclick="uploadCSV()">Upload &amp; score</button></div>
        <div style="flex:0;"><button class="btn-secondary" onclick="exportCSV()">Export CSV</button></div>
        <div style="flex:0;"><button class="btn-secondary" onclick="findDupes()">Find duplicates</button></div>
      </div>
      <div id="status"></div>
    </div>

    <!-- Plan the round at a desk. The same nearby.js search go.html runs in the
         street, but on a screen big enough to read properly before you walk. -->
    <div class="card">
      <h2>Prospect an area</h2>
      <div class="row">
        <div style="flex:2;">
          <label>Postcode or town</label>
          <input id="areaQ" placeholder="e.g. DE1 3GL, or Ashbourne" onkeydown="if(event.key==='Enter')prospect()" />
        </div>
        <div style="flex:0;min-width:130px;">
          <label>Radius</label>
          <select id="areaRadius">
            <option value="250">250m</option><option value="500" selected>500m</option>
            <option value="1000">1km</option><option value="2000">2km</option>
          </select>
        </div>
        <div style="flex:0;"><button class="btn-primary" onclick="prospect()">Search</button></div>
      </div>
      <div id="areaOut"></div>
    </div>

    <div class="card" style="padding:14px 18px;">
      <div class="row" style="align-items:center;margin:0;">
        <div style="flex:2;"><input id="leadSearch" placeholder="Search leads — name, category, address…" oninput="render()" /></div>
        <div style="flex:0;min-width:150px;">
          <select id="leadStatusFilter" onchange="render()">
            <option value="">All statuses</option>
            <option>New</option><option>Come back</option><option>Contacted</option><option>On trial</option><option>Converted</option><option>Lost</option>
          </select>
        </div>
        <div style="flex:0;min-width:130px;">
          <select id="leadTierFilter" onchange="render()">
            <option value="">All tiers</option>
            <option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option>
          </select>
        </div>
        <div style="flex:0;">
          <label class="checkline" title="Hide likely dead ends — rating under 3.0★ or fewer than 10 reviews. They stay in your list, just filtered from view.">
            <input type="checkbox" id="hideDeadEnds" onchange="render()" /> Hide dead ends
          </label>
        </div>
        <div style="flex:0;" class="viewtog">
          <button id="vList" class="on" onclick="setView('list')">List</button>
          <button id="vMap" onclick="setView('map')">Map</button>
        </div>
      </div>
    </div>

    <div class="counts" id="counts"></div>
    <div id="leadMap"></div>
    <div id="leadList"></div>
  </main>
  <div id="draftModal" class="modal-bg" onclick="if(event.target===this)closeDraft()"></div>
</div>

<script src="/map-pins.js"></script>
<script>
  const API = "/.netlify/functions/leads";
  const NEARBY_API = "/.netlify/functions/nearby";
  // "Come back" is the most common outcome of a cold knock — the owner wasn't in.
  // Without it that door is either wrongly marked Contacted or left as New and
  // forgotten, and it's the one you most need to find again tomorrow.
  const STATUSES = ["New","Come back","Contacted","On trial","Converted","Lost"];
  let token = sessionStorage.getItem("treyAdminToken") || "";
  let LEADS = [];
  let DRAFT_STATE = { phone:"", email:"" };

  function saveToken(){ const v=document.getElementById("tokenInput").value.trim(); if(!v)return; token=v; sessionStorage.setItem("treyAdminToken",v); boot(); }
  function logout(){ sessionStorage.removeItem("treyAdminToken"); token=""; document.getElementById("app").style.display="none"; document.getElementById("gate").style.display="block"; }
  function setStatus(m,t){ const e=document.getElementById("status"); e.textContent=m; e.className=t||""; }

  // ---------- helpers ----------
  const fne=(row,keys)=>{ for(const k of keys){ const v=(row[k]||"").toString().trim(); if(v)return v; } return ""; };
  const toNum=v=>{ const n=parseFloat(v); return isNaN(n)?null:n; };
  const clsStatus=s=>"s-"+(s||"New").replace(/\s/g,"");
  function fmtDate(d){ if(!d||isNaN(d))return""; const p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear(); }
  // Escape for HTML — including quotes, so it's safe inside attribute values
  // (textContent alone escapes <>& but leaves " and ', which breaks out of an
  // href="..."). Lead data is scraped from Google, so treat it as hostile.
  const esc=v=>{ v=(v==null?"":String(v)); const d=document.createElement("div"); d.textContent=v; return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;"); };
  // Only allow http(s) links; anything else (javascript:, data:, …) is dropped.
  const safeUrl=u=>{ u=(u==null?"":String(u)); return /^https?:\/\//i.test(u)?u:""; };

  // ---------- Trey Score (customer-facing Google-health estimate) ----------
  // Mirrors scoreBusiness() in netlify/functions/profile-audit.js — keep in sync.
  function pctToNum(v){ if(v==null)return null; var m=String(v).match(/(\d+(\.\d+)?)/); return m?Math.max(0,Math.min(1,parseFloat(m[1])/100)):null; }
  function treyScore(inp){
    var rep=inp.reputation||{},act=inp.activity||{},comp=inp.completeness||{};
    var cl=function(x,a,b){return Math.max(a,Math.min(b,x));};
    var rating=Number(rep.rating);
    var ratingPts=isFinite(rating)&&rating>0?Math.round(cl((rating-3.0)/1.7,0,1)*18):0;
    var rc=Number(rep.reviewCount)||0;
    var rcPts=rc>=100?12:rc>=50?10:rc>=25?7:rc>=10?4:rc>=1?2:0;
    var r90=Number(rep.reviewsLast90);
    var recPts=!isFinite(r90)?7:r90>=12?15:r90>=8?13:r90>=6?11:r90>=4?8:r90>=2?5:r90>=1?3:0;
    var rr=rep.replyRate; var rrPts=(rr==null||isNaN(rr))?3:Math.round(cl(rr,0,1)*10);
    var repPts=ratingPts+rcPts+recPts+rrPts;
    var actPts=(act.postedRecently?8:act.postedWithin3m?4:0)+(act.photosFresh?7:act.photosSome?3:0);
    var compPts=(comp.primaryCategory?6:0)+((comp.secondaryCount||0)>=2?5:0)+(comp.description&&String(comp.description).length>=120?5:0)+((comp.serviceCount||0)>=3?5:0)+(comp.hoursSet?3:0)+(comp.website?3:0)+(comp.phone?2:0)+((comp.attributeCount||0)>=1?1:0);
    var total=cl(Math.round(repPts+actPts+compPts),0,100);
    var band=total>=90?{label:"Excellent",color:"#16a34a"}:total>=75?{label:"Strong",color:"#16a34a"}:total>=50?{label:"Getting there",color:"#f59e0b"}:{label:"Needs work",color:"#ef4444"};
    return {total:total,band:band.label,color:band.color};
  }
  function estTreyFromLead(l){
    return treyScore({reputation:{rating:Number(l.rating),reviewCount:Number(l.reviewCount)||0,reviewsLast90:l.reviewsLast90,replyRate:pctToNum(l.ownerResponseRate)},
      activity:{postedRecently:false,photosFresh:false},
      completeness:{primaryCategory:!!l.category,secondaryCount:l.secondaryCount||0,description:l.description,serviceCount:l.serviceCount||0,hoursSet:!!l.hoursSet,website:!!l.website,phone:!!l.phone,attributeCount:l.attributeCount||0}});
  }

  // ---------- Opportunity score (who to ring first) ----------
  // Trey Score says how healthy a business's profile is. Opportunity says how
  // much *Trey* can move the needle × how winnable they are — so the best leads
  // float to the top and we don't chase businesses we can't help or reach.
  /**
   * PROSPECT QUALITY — one number, one truth.
   *
   * There were two answers to "how good a lead is this", and on Matthew's real
   * 286 they disagreed about 39 of the 62 Tier 1 leads — 63%.
   *
   *   - `l.score`/`l.tier`  computed at Apify import. KNOWS THE OWNER REPLY RATE.
   *   - opportunityScore()  recomputed live, dominated by
   *                         gap x (reviewCount/150) x 40 — i.e. review VOLUME.
   *
   * Example from the live data: Sir's Barber Shop, 4.7 stars, 96 reviews, 0%
   * replies. Apify scores it 81 (Tier 1) because never replying is the whole
   * pitch. opportunityScore says 49, "Warm", because 96 reviews isn't many.
   * Meanwhile ROYAL BARBER — 4.9 stars, 295 reviews, 5% replies — comes out
   * "Hot" on volume alone while Apify puts it in Tier 2.
   *
   * The Apify score wins because it is the only one that can see the reply rate,
   * and because it targets the 4.0-4.7 sweet spot where a tap stand actually
   * moves the needle. This is the same reasoning that produced fieldScore for
   * the street tool.
   *
   * opportunityScore stays as the FALLBACK for leads that never came from Apify
   * (quick-added, or saved from the field), which have no stored score. Those are
   * marked so the difference is visible rather than silently mixed in.
   *
   * NOTE: the "Trey Score" badge is a DIFFERENT question and stays — that is the
   * business's own Google health, the thing you show THEM. This is how good a
   * prospect they are for you.
   */
  function prospectScore(l){
    const stored = Number(l && l.score);
    if (isFinite(stored) && stored > 0) {
      const tier = Number(l.tier) || (stored >= 72 ? 1 : stored >= 52 ? 2 : 3);
      return { total: Math.round(stored), tier,
               band: tier === 1 ? "Best door" : tier === 2 ? "Worth a look" : "Skip",
               color: tier === 1 ? "#047857" : tier === 2 ? "#b45309" : "#94a3b8",
               source: "apify" };
    }
    const op = opportunityScore(l);
    const tier = op.total >= 60 ? 1 : op.total >= 33 ? 2 : 3;
    return { total: op.total, tier,
             band: tier === 1 ? "Best door" : tier === 2 ? "Worth a look" : "Skip",
             color: tier === 1 ? "#047857" : tier === 2 ? "#b45309" : "#94a3b8",
             source: "live" };
  }

  // Mirrors opportunityScore() in netlify/functions/profile-audit.js — keep in sync.
  function opportunityScore(l){
    var cl=function(x,a,b){return Math.max(a,Math.min(b,x));};
    var rating=Number(l.rating);                      // may be NaN (unknown)
    var rc=Number(l.reviewCount)||0;
    var replyRate=pctToNum(l.ownerResponseRate);      // 0..1 or null
    var r90=Number(l.reviewsLast90);                  // may be NaN
    var recent=Number(l.recentUnanswered)||0;
    // size — how real an audience is behind those reviews (caps at 150).
    var size=cl(rc/150,0,1);
    // 1) reply gap (0-40) — Trey's core value: reviews coming in, nobody replying.
    var gap=(replyRate==null)?0.5:(1-replyRate);
    var replyGapPts=gap*size*40;
    // 2) activity (0-20) — established & still getting reviews = worth the effort.
    var actPts=rc>=10?16:rc>=3?8:0;
    if(isFinite(r90)&&r90>=1)actPts=Math.min(actPts+4,20);
    // 3) pain (0-20) — recent unanswered poor reviews create urgency.
    var painPts=Math.min(recent*7,20);
    // 4) completeness gap (0-20) — missing basics Trey tidies up quickly.
    var compPts=(l.website?0:8)+(l.category?0:8)+(l.phone?0:4);
    var raw=cl(replyGapPts+actPts+painPts+compPts,0,100);
    // winnability (0-1) — low ratings are hard to save & hard to convert; no
    // contact route makes them harder still.
    var win;
    if(!isFinite(rating)||rating<=0)win=0.7;
    else if(rating<2.8)win=0.25;
    else if(rating<3.3)win=0.6;
    else if(rating<3.8)win=0.85;
    else win=1.0;
    if(!l.phone&&!l.email)win*=0.7;
    var total=Math.round(cl(raw*win,0,100));
    var band=total>=60?{label:"Hot",color:"#16a34a"}:total>=33?{label:"Warm",color:"#f59e0b"}:{label:"Cold",color:"#94a3b8"};
    return {total:total,band:band.label,color:band.color};
  }
  // Dead end = same bar as the LOW RATING / THIN flags: sub-3.0★ or under 10 reviews.
  function isDeadEnd(l){
    var rating=Number(l.rating), rc=Number(l.reviewCount);
    // Unknown != dead end — a hand-added lead with no scrape data isn't judged,
    // or it would be hidden by the filter before anyone had looked at it.
    if(!isFinite(rating)&&!isFinite(rc))return false;
    if(isFinite(rating)&&rating>0&&rating<3.0)return true;
    return isFinite(rc)&&rc<10;
  }

  // ---------- v2 scoring (mirrors docs/lead-scoring-spec.md) ----------
  function scoreApify(row){
    if((row["permanentlyClosed"]||"").toLowerCase()==="true"||(row["temporarilyClosed"]||"").toLowerCase()==="true") return null;
    const rating=toNum(fne(row,["totalScore","rating","stars"]));
    const rcRaw=toNum(fne(row,["reviewsCount","userRatingsCount"]));
    const reviewCount=rcRaw==null?0:Math.round(rcRaw);
    const revs=[]; let i=0;
    while(("reviews/"+i+"/stars") in row){
      const s=(row["reviews/"+i+"/stars"]||"").toString().trim();
      if(s){ const d=new Date((row["reviews/"+i+"/publishedAtDate"]||"").trim());
        revs.push({stars:Math.round(parseFloat(s)),dt:isNaN(d)?null:d,text:(row["reviews/"+i+"/text"]||"").trim(),resp:(row["reviews/"+i+"/responseFromOwnerText"]||"").trim()}); }
      i++;
    }
    const responded=revs.filter(r=>r.resp).length;
    const rate=revs.length?responded/revs.length:null;
    const poor=revs.filter(r=>r.stars<=3&&!r.resp);
    const REF=new Date();
    const recent=poor.filter(r=>r.dt&&(REF-r.dt)/86400000<=365);
    const phone=fne(row,["phone","phoneUnformatted"]);
    const email=fne(row,Array.from({length:17},(_,n)=>"emails/"+n));
    const website=(row["website"]||"").trim();
    const R=[]; let A=0;
    if(rate!==null){ if(rate===0){A=25;R.push("0% replies +25");} else if(rate<0.30){A=18;R.push(Math.round(rate*100)+"% replies +18");} else if(rate<0.60){A=8;R.push(Math.round(rate*100)+"% replies +8");} }
    let B=0;
    if(rating!==null){ if(rating>=4.0&&rating<=4.7){B=25;R.push(rating+"★ sweet spot +25");} else if((rating>=3.5&&rating<4.0)||(rating>4.7&&rating<=4.9)){B=15;R.push(rating+"★ +15");} else if(rating>4.9){B=12;R.push(rating+"★ near-perfect +12");} else if(rating>=3.0&&rating<3.5){B=8;R.push(rating+"★ +8");} }
    const C=Math.min(recent.length*7,20); if(C)R.push(recent.length+" recent unanswered +"+C);
    let D; if(reviewCount>=25&&reviewCount<=300)D=15; else if((reviewCount>=10&&reviewCount<25)||(reviewCount>300&&reviewCount<=800))D=10; else if(reviewCount>800)D=6; else D=4;
    R.push(reviewCount+" reviews +"+D);
    const E=(phone?6:0)+(email?6:0)+(website?3:0); if(E)R.push("contact +"+E);
    const total=A+B+C+D+E;
    const tier=total>=72?1:(total>=52?2:3);
    const flag=(rating!==null&&rating<3.0)?"LOW RATING":(reviewCount<10?"THIN":"");
    let hook=""; const pool=recent.length?recent:poor;
    if(pool.length){ const L=pool.slice().sort((a,b)=>(b.dt||0)-(a.dt||0))[0]; const t=L.text.slice(0,120)+(L.text.length>120?"...":""); hook="["+L.stars+"★ "+fmtDate(L.dt)+"] \""+t+"\""; }
    const reviewsLast90=revs.filter(r=>r.dt&&(REF-r.dt)/86400000<=90).length;
    let secondaryCount=0,ci=1; while(("categories/"+ci) in row){ if((row["categories/"+ci]||"").trim())secondaryCount++; ci++; }
    // Apify's export already carries the coordinates. Taking them here means a
    // town swept the night before is instantly mappable, with ZERO Places
    // lookups — they'd otherwise cost one paid call each for data that arrived
    // free. Column names vary with how the CSV was flattened, so try the ones
    // Apify actually emits. leads.js stamps geoAt and enforces the 30-day clock.
    const geo=apifyGeo(row);
    return {placeId:(row["placeId"]||"").trim(),businessName:(row["title"]||"").trim(),category:fne(row,["categoryName","categories/0"]),
      lat:geo.lat,lng:geo.lng,
      email,phone,website,rating,reviewCount,ownerResponseRate:rate===null?"n/a":Math.round(rate*100)+"%",recentUnanswered:recent.length,
      reviewsLast90:(revs.length?reviewsLast90:undefined),secondaryCount,
      hook,scoreReasons:R.join(" · "),flag,reviewUrl:(row["placeId"]?"https://search.google.com/local/writereview?placeid="+row["placeId"]:""),
      address:(row["address"]||"").trim(),tier,score:total};
      // NB: no outreachStatus here on purpose — the server keeps any existing
      // pipeline status on re-import, so re-scraping never resets a lead to "New".
  }
  // Apify flattens nested objects with a slash, but the exact shape depends on
  // the export options, so accept the handful of spellings it produces.
  function apifyGeo(row){
    const pick=(keys)=>{
      for(const k of keys){
        const v=row[k];
        if(v===undefined||v===null||String(v).trim()==="") continue;
        const n=Number(v);
        if(!isNaN(n)&&isFinite(n)) return n;
      }
      return undefined;
    };
    const lat=pick(["location/lat","location/latitude","latitude","lat"]);
    const lng=pick(["location/lng","location/longitude","longitude","lng","lon"]);
    // Both or neither — half a coordinate is worse than none, because
    // Number(undefined) downstream would put it in the Atlantic.
    if(lat===undefined||lng===undefined) return {};
    // A plausibility check. 0,0 is the classic "missing data" value and sits in
    // the Gulf of Guinea; a real UK business is never there.
    if(Math.abs(lat)>90||Math.abs(lng)>180||(lat===0&&lng===0)) return {};
    return {lat,lng};
  }

  function fromScored(row){
    // placeId is the identity. Reading it back is what makes an export/import
    // round trip UPDATE the lead instead of duplicating it.
    return {placeId:(row["Place ID"]||row["placeId"]||"").trim(),
      businessName:(row["Business Name"]||"").trim(),category:(row["Category"]||"").trim(),email:(row["Primary Email"]||"").trim(),
      phone:(row["Phone"]||"").replace(/^'/,"").trim(),rating:toNum(row["Google Rating"]),reviewCount:parseInt(row["Total Reviews"])||0,
      ownerResponseRate:(row["Owner Response Rate"]||"").trim(),recentUnanswered:parseInt(row["Recent Unanswered Poor Reviews"]||row["Unanswered Poor Reviews Count"])||0,
      hook:(row["Key Sales Hook / Review Sample"]||"").trim(),scoreReasons:(row["Score Reasons"]||"").trim(),flag:(row["Flag"]||"").trim(),
      reviewUrl:(row["Direct Review URL"]||"").trim(),website:(row["Website"]||"").trim(),address:(row["Address"]||"").trim(),
      tier:parseInt(row["Tier"])||null,score:parseInt(row["Score"]),outreachStatus:(row["Outreach Status"]||"New").trim()||"New",
      ...apifyGeo(row)};
  }

  // ---------- upload ----------
  function uploadCSV(){
    const f=document.getElementById("csvFile").files[0];
    if(!f){ setStatus("Choose a CSV file first.","error"); return; }
    setStatus("Reading "+f.name+"…","");
    Papa.parse(f,{header:true,skipEmptyLines:true,complete:async(res)=>{
      const rows=res.data; if(!rows.length){ setStatus("No rows found.","error"); return; }
      const first=rows[0]; let list=[];
      if(("Business Name" in first)||("Tier" in first)){ list=rows.map(fromScored).filter(l=>l.businessName); }
      else if("title" in first){ list=rows.map(scoreApify).filter(Boolean); }
      else { setStatus("Unrecognised CSV — expected an Apify export or a Trey scored file.","error"); return; }
      setStatus("Saving "+list.length+" leads…","");
      try{ const saved=await bulkSave(list); setStatus("Added "+saved+" leads.","success"); loadLeads(); }
      catch(e){ const n=(e&&e.saved)||0; setStatus("Upload stopped after "+n+" of "+list.length+" — "+e.message+". Re-uploading is safe for rows with a place/phone.","error"); loadLeads(); }
    },error:(e)=>setStatus("Could not read file: "+e.message,"error")});
  }
  async function bulkSave(list){
    let saved=0;
    for(let i=0;i<list.length;i+=50){
      const batch=list.slice(i,i+50);
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,leads:batch})});
      if(r.status===403){ logout(); throw new Error("Unauthorized"); }
      if(!r.ok){ const e=new Error("HTTP "+r.status); e.saved=saved; throw e; }
      saved+=batch.length;
    }
    return saved;
  }
  async function quickAdd(){
    const name=document.getElementById("q_name").value.trim(); if(!name)return;
    await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,lead:{businessName:name,outreachStatus:"New"}})});
    document.getElementById("q_name").value=""; loadLeads();
  }

  // ---------- actions ----------
  async function post(payload){ const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,...payload})}); if(r.status===403){logout();return;} return r; }
  async function cycleStatus(i){ const l=LEADS[i]; const idx=STATUSES.indexOf(l.outreachStatus); const next=STATUSES[(idx+1)%STATUSES.length]; await post({lead:{id:l.id,outreachStatus:next}}); loadLeads(); }
  async function setStatusTo(i,s){ await post({lead:{id:LEADS[i].id,outreachStatus:s}}); loadLeads(); }
  async function saveLead(i){ const l=LEADS[i]; const g=id=>document.getElementById(id+"_"+i).value.trim();
    await post({lead:{id:l.id,businessType:g("bt"),contactName:g("cn"),phone:g("ph"),email:g("em"),notes:g("nt")}}); loadLeads(); }
  async function delLead(i){ await post({delete:LEADS[i].id}); loadLeads(); }
  // PECR channel verdict, computed server-side in leads.js and attached as
  // l.outreach. Rendered here so it is impossible to start a message without
  // seeing it. If the server sent no verdict (a stale cached response), say so
  // rather than implying everything is fine.
  function pecrBanner(l){
    const o=l.outreach;
    if(!o) return '<div class="pecr limited"><b>Outreach rules not loaded</b> — refresh before contacting this lead.</div>';
    const cls=o.electronicMail?"open":(o.phone?"limited":"blocked");
    const chip=(on,label)=>'<span class="chan '+(on?"yes":"no")+'">'+(on?"\u2713 ":"\u2717 ")+label+'</span>';
    const label=o.legalStatus==="ltd"?"Limited company":o.legalStatus==="sole_trader"?"Sole trader":"Status unknown";
    return '<div class="pecr '+cls+'">'+
      chip(o.electronicMail,"Email / WhatsApp")+chip(o.phone,"Phone")+chip(o.post,"Post")+
      '<div style="margin-top:7px;"><b>'+esc(label)+'.</b> '+esc(o.reason)+'</div></div>';
  }

  async function saveCompliance(i){
    const l=LEADS[i];
    const consent=document.getElementById("mc_"+i).checked;
    await post({lead:{id:l.id,
      legalStatus:document.getElementById("ls_"+i).value,
      tpsStatus:document.getElementById("tps_"+i).value,
      marketingConsent:consent,
      consentSource:consent?(l.consentSource||("recorded by hand "+new Date().toISOString().slice(0,10))):""}});
    loadLeads();
  }

  function toggle(i){ const d=document.getElementById("detail_"+i); d.style.display=d.style.display==="block"?"none":"block"; }

  // ---------- render ----------
  async function loadLeads(){
    const list=document.getElementById("leadList");
    list.innerHTML='<div class="muted" style="padding:10px;">Loading…</div>';
    try{
      const r=await fetch(API,{headers:{Authorization:"Bearer "+token}}); if(r.status===403){logout();return;}
      LEADS=await r.json(); if(!Array.isArray(LEADS))LEADS=[];
      // Default sort: Opportunity high→low (ring the best first), then old lead score.
      // One sort order, matching the badge and the map colours.
      LEADS.sort((a,b)=>(prospectScore(b).total-prospectScore(a).total)||((b.score||-1)-(a.score||-1)));
      render();
    }catch(e){ list.innerHTML='<div class="muted" style="padding:10px;">Failed to load: '+esc(e.message)+'</div>'; }
  }
  function render(){
    // counts (always the full pipeline, not the filtered view)
    const c={}; STATUSES.forEach(s=>c[s]=0); LEADS.forEach(l=>{ c[l.outreachStatus]=(c[l.outreachStatus]||0)+1; });
    document.getElementById("counts").innerHTML='<span class="count"><b>'+LEADS.length+'</b>total</span>'+
      STATUSES.map(s=>'<span class="count"><b>'+(c[s]||0)+'</b>'+s+'</span>').join("");
    if(!LEADS.length){ document.getElementById("leadList").innerHTML='<div class="card muted">No leads yet — add one above or upload a CSV.</div>'; return; }
    // filter — keep each lead's ORIGINAL index so the row actions still target LEADS[i]
    const el=document.getElementById("leadSearch"); const q=(el&&el.value||"").toLowerCase().trim();
    const sf=document.getElementById("leadStatusFilter"); const st=sf&&sf.value||"";
    const tf=document.getElementById("leadTierFilter"); const tier=tf&&tf.value||"";
    const hd=document.getElementById("hideDeadEnds"); const hideDead=!!(hd&&hd.checked);
    const rows=LEADS.map((l,i)=>({l,i})).filter(function(o){
      const l=o.l;
      const hay=[l.businessName,l.category,l.address,l.contactName,l.phone,l.email].filter(Boolean).join(" ").toLowerCase();
      const okQ=!q||hay.indexOf(q)>-1;
      const okSt=!st||(l.outreachStatus||"New")===st;
      const okT=!tier||String(l.tier||"")===tier;
      const okDead=!hideDead||!isDeadEnd(l);
      return okQ&&okSt&&okT&&okDead;
    });
    ROWS = rows;
    document.getElementById("leadList").innerHTML = rows.length
      ? rows.map(function(o){return leadCard(o.l,o.i);}).join("")
      : '<div class="card muted">No leads match your search.</div>';
    drawMap();
  }

  // ---- The planning map ----------------------------------------------------
  // Same idea as go.html: the PICTURE costs a Static Maps call, the DOTS are
  // free. So the picture is fetched once, fitted to whatever is on screen, and
  // every subsequent filter or search just redraws dots over it instantly. A
  // "Refit" button appears when the filtered set has drifted off the frame.
  let VIEW = "list", ROWS = [], MAPDATA = null, MAPFOR = 0;
  // Why the last map attempt produced no picture, in the server's own words.
  let MAPERR = null;
  // null = fit everything in frame (the default). A number = you've zoomed.
  let MAPZOOM = null;
  // Colour the dots by prospect tier, or by where they are in the pipeline.
  // Tier is the default because it's what you decide a walk on; status becomes
  // the useful one once you've actually been out and set some.
  let COLOUR_BY = "tier";

  function setColourBy(v){ COLOUR_BY = v; drawMap(); }
  function zoomMap(delta){
    const base = MAPZOOM != null ? MAPZOOM : (MAPDATA ? MAPDATA.zoom : 14);
    MAPZOOM = Math.max(1, Math.min(20, base + delta));
    fetchBaseMap();
  }
  function zoomFit(){ MAPZOOM = null; fetchBaseMap(); }

  function setView(v){
    VIEW = v;
    document.getElementById("vList").className = v === "list" ? "" : "";
    document.getElementById("vList").className = v === "list" ? "on" : "";
    document.getElementById("vMap").className  = v === "map"  ? "on" : "";
    if (v === "map" && !MAPDATA) { fetchBaseMap(); return; }
    drawMap();
  }

  const withGeo = (rows) => rows.filter(o => o.l.lat != null && o.l.lng != null);
  const needGeo = (rows) => rows.filter(o => (o.l.lat == null || o.l.lng == null) && o.l.placeId);

  // Colour by TIER, not by pipeline status.
  //
  // The first version coloured by outreachStatus, which was a mistake that only
  // showed up against real data: all 286 leads were "New", so the map was a sea
  // of identical green dots. Tier is what actually varies (62 / 143 / 81) and
  // it's what you're deciding on when planning a walk.
  //
  // It also means green/amber/grey now mean the SAME thing here as in go.html —
  // best door, worth a look, skip. Two maps using one palette for two different
  // things was asking to be misread, and was.
  //
  // Pipeline status only overrides the colour when the business isn't a prospect
  // at all: already yours (indigo) or lost (faded).
  function pinCls(l){
    const st = l.outreachStatus || "New";
    if (COLOUR_BY === "status") {
      // The same five colours as the pills on the cards, so a dot and its row
      // always agree at a glance.
      return st === "Come back" ? "st-comeback"
        : st === "Contacted" ? "st-contacted"
        : st === "On trial" ? "st-trial"
        : st === "Converted" ? "st-converted"
        : st === "Lost" ? "st-lost" : "st-new";
    }
    if (l.isClient || st === "Converted" || st === "On trial") return "mine";
    if (st === "Lost") return "lost";
    const t = Number(l.tier);
    return t === 1 ? "t1" : t === 2 ? "t2" : t === 3 ? "t3" : "t3";
  }

  async function fetchBaseMap(){
    const box = document.getElementById("leadMap");
    const pts = withGeo(ROWS).map(o => ({ lat:o.l.lat, lng:o.l.lng }));
    if (!pts.length) { drawMap(); return; }
    box.innerHTML = '<div class="card muted">Drawing the map…</div>';
    try {
      const res = await fetch(NEARBY_API, { method:"POST",
        headers:{ "Content-Type":"application/json", Authorization:"Bearer "+token },
        body: JSON.stringify({ action:"basemap", points: pts,
          // Only sent when you've zoomed; otherwise the server fits the pins.
          zoom: MAPZOOM == null ? undefined : MAPZOOM }) });
      if (res.status === 403) { logout(); return; }
      const d = await res.json();
      MAPDATA = d.map || null;
      // Whatever Google actually said, verbatim. A blank map used to be silent
      // and the printed guess was wrong, which cost an evening.
      MAPERR = MAPDATA ? null : (d.mapError || d.error || null);
      MAPFOR = pts.length;
    } catch(e) { MAPDATA = null; MAPERR = "Couldn't reach Trey's server to build the map."; }
    drawMap();
  }

  function drawMap(){
    const box = document.getElementById("leadMap");
    if (VIEW !== "map") { box.innerHTML = ""; return; }

    const placed = withGeo(ROWS), missing = needGeo(ROWS);
    let note = "";
    if (missing.length) {
      // Never silently show fewer pins than leads. Say what's missing and offer
      // to fix it, with the cost stated up front.
      note += '<div class="mapnote"><b>' + missing.length + '</b> of ' + ROWS.length +
        ' leads have no coordinates yet, so they can\'t be drawn. ' +
        '<button class="btn-secondary" style="margin-left:6px" onclick="locateMissing()">Look up ' +
        Math.min(missing.length, 60) + '</button> ' +
        '<span class="muted">(one Google lookup each; kept 30 days)</span></div>';
    }
    if (!MAPDATA) {
      // Say WHY, in Google's own words, rather than guessing at a cause. The
      // list below still works — a missing picture is never fatal.
      const why = placed.length
        ? (MAPERR ? esc(MAPERR) : 'No map picture came back, and the server gave no reason.')
        : 'None of these leads have coordinates yet.';
      box.innerHTML = note + '<div class="card muted">' + why +
        (placed.length ? ' <button class="btn-secondary" style="margin-left:6px" ' +
          'onclick="fetchBaseMap()">Try again</button>' : '') + '</div>';
      return;
    }

    const onFrame = TreyMap.countPlaceable(MAPDATA, placed.map(o => o.l));
    if (onFrame < placed.length) {
      note += '<div class="mapnote">' + (placed.length - onFrame) +
        ' outside this view. <button class="btn-secondary" onclick="fetchBaseMap()">Refit map</button></div>';
    }

    const ctl =
      '<div class="mapctl">' +
      '<button onclick="zoomMap(1)" title="Zoom in">+</button>' +
      '<button onclick="zoomMap(-1)" title="Zoom out">&minus;</button>' +
      '<button class="colby" style="width:auto" onclick="zoomFit()" ' +
        (MAPZOOM == null ? 'disabled' : '') + ' title="Fit every pin back in frame">Fit</button>' +
      '<span class="lab">' + (MAPZOOM == null ? 'fitted' : 'zoom ' + MAPZOOM) + '</span>' +
      '<span style="flex:1"></span>' +
      '<span class="lab">Colour</span>' +
      '<button class="colby' + (COLOUR_BY === "tier" ? " on" : "") + '" onclick="setColourBy(\'tier\')">Tier</button>' +
      '<button class="colby' + (COLOUR_BY === "status" ? " on" : "") + '" onclick="setColourBy(\'status\')">Status</button>' +
      '</div>';

    const legend = COLOUR_BY === "status"
      ? [{colour:"#94a3b8",label:"New"},{colour:"#ea580c",label:"Come back"},
         {colour:"#2563eb",label:"Contacted"},{colour:"#ca8a04",label:"On trial"},
         {colour:"#16a34a",label:"Converted"},{colour:"#dc2626",label:"Lost"}]
      : [{colour:"#047857",label:"Tier 1"},{colour:"#b45309",label:"Tier 2"},
         {colour:"#94a3b8",label:"Tier 3"},{colour:"#4338ca",label:"Already yours"}];

    const pins = placed.map(o => ({
      lat:o.l.lat, lng:o.l.lng, cls:pinCls(o.l), label:"",
      title:(o.l.businessName||"") + " — Tier " + (o.l.tier||"?") +
            " · " + (o.l.outreachStatus||"New"),

  // Fill in coordinates for leads that have a place_id but no lat/lng — anything
  // imported from Apify, and anything saved before the map existed.
  async function locateMissing(){
    const missing = needGeo(ROWS).slice(0, 60);
    if (!missing.length) return;
    const box = document.getElementById("leadMap");
    box.innerHTML = '<div class="card muted">Looking up ' + missing.length + ' locations…</div>';
    try {
      const res = await fetch(NEARBY_API, { method:"POST",
        headers:{ "Content-Type":"application/json", Authorization:"Bearer "+token },
        body: JSON.stringify({ action:"locate", placeIds: missing.map(o => o.l.placeId) }) });
      if (res.status === 403) { logout(); return; }
      const d = await res.json();
      if (d.error) { box.innerHTML = '<div class="card muted">'+esc(d.error)+'</div>'; return; }
      const updates = [];
      missing.forEach(o => {
        const hit = d.found && d.found[o.l.placeId];
        if (!hit) return;
        o.l.lat = hit.lat; o.l.lng = hit.lng;
        updates.push({ id:o.l.id, placeId:o.l.placeId, businessName:o.l.businessName,
                       lat:hit.lat, lng:hit.lng });
      });
      if (updates.length) {
        await fetch(API, { method:"POST",
          headers:{ "Content-Type":"application/json", Authorization:"Bearer "+token },
          body: JSON.stringify({ leads: updates }) });
      }
      // The server works to a deadline (Netlify kills a function at 10s), so a
      // big backlog needs more than one press. Say how many are left rather than
      // looking finished when it isn't.
      MAPDATA = null;
      await fetchBaseMap();
      const left = needGeo(ROWS).length;
      if (left) {
        const box2 = document.getElementById("leadMap");
        box2.insertAdjacentHTML("afterbegin",
          '<div class="mapnote">Located <b>' + updates.length + '</b>. <b>' + left +
          '</b> still to go — press <b>Look up</b> again.' +
          ((d.failed && d.failed.length) ? ' ' + d.failed.length + ' had no location on Google.' : '') +
          '</div>');
      }
    } catch(e){ box.innerHTML = '<div class="card muted">Lookup failed: '+esc(e.message)+'</div>'; }
  }

  // ---------- export ----------
  // ---- Duplicates ----------------------------------------------------------
  // The same business can end up stored twice under different keys: leadKey()
  // uses the place ID when there is one ("p_ChIJ…") and falls back to
  // name+phone ("l_acebarbers_447…") when there isn't. A CSV that had lost its
  // Place ID column therefore re-imported as NEW records rather than updates.
  //
  // The export and import both carry the place ID now, so this shouldn't recur —
  // but 106 duplicates already exist, and they need merging rather than deleting,
  // because the two halves hold different things: the Apify copy has the place ID
  // and coordinates, the re-imported copy may hold a status you set by hand.
  const normName = (v) => String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");

  function dupeGroups(){
    const by = {};
    LEADS.forEach(l => { const k = normName(l.businessName); if (k) (by[k] = by[k] || []).push(l); });
    return Object.values(by).filter(v => v.length > 1);
  }

  // Prefer the record with a place ID — it's the one future imports will match,
  // and it carries the coordinates. Tie-break on how much it actually holds.
  function pickKeeper(group){
    return group.slice().sort((a,b) =>
      (b.placeId ? 1 : 0) - (a.placeId ? 1 : 0) ||
      (b.lat != null ? 1 : 0) - (a.lat != null ? 1 : 0) ||
      Object.keys(b).length - Object.keys(a).length)[0];
  }

  // Anything the keeper is missing gets taken from the others, so a merge can
  // only ever ADD information. Status and consent are treated specially: a real
  // pipeline status beats "New", and consent evidence is never dropped.
  function mergeGroup(group){
    const keeper = pickKeeper(group);
    const losers = group.filter(l => l !== keeper);
    const merged = Object.assign({}, keeper);
    const SKIP = { id:1, isClient:1, outreach:1, updatedAt:1 };
    losers.forEach(l => {
      Object.keys(l).forEach(k => {
        if (SKIP[k]) return;
        const cur = merged[k], inc = l[k];
        if (inc === undefined || inc === null || inc === "") return;
        if (cur === undefined || cur === null || cur === "") merged[k] = inc;
      });
      if ((merged.outreachStatus||"New") === "New" && l.outreachStatus && l.outreachStatus !== "New") {
        merged.outreachStatus = l.outreachStatus;
      }
      if (l.marketingConsent === true) merged.marketingConsent = true;
      if (l.consentHistory && l.consentHistory.length) {
        merged.consentHistory = (merged.consentHistory||[]).concat(l.consentHistory);
      }
    });
    return { keeper, merged, losers };
  }

  function findDupes(){
    const groups = dupeGroups();
    const st = document.getElementById("status");
    if (!groups.length) { st.innerHTML = '<div class="ok">No duplicates found.</div>'; return; }
    const extra = groups.reduce((a,g) => a + g.length - 1, 0);
    const preview = groups.slice(0,6).map(g => {
      const { keeper } = mergeGroup(g);
      return "&bull; " + esc((g[0].businessName||"").slice(0,34)) + " &mdash; " + g.length +
        " copies, keeping the one " + (keeper.placeId ? "with a Place ID" : "with the most data");
    }).join("<br>");
    st.innerHTML =
      '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:12px;margin-top:10px;">'+
      '<b>' + groups.length + ' business' + (groups.length===1?"":"es") + ' stored more than once</b> &mdash; ' +
      extra + ' extra record' + (extra===1?"":"s") + '.<br>' +
      '<div style="font-size:12.5px;color:#78350f;margin-top:6px;line-height:1.6;">' + preview +
      (groups.length > 6 ? "<br>&hellip;and " + (groups.length-6) + " more" : "") + '</div>' +
      '<div style="font-size:12.5px;color:#78350f;margin-top:8px;">Merging keeps everything: any field the survivor is missing is taken from the copy, a real status beats &ldquo;New&rdquo;, and consent records are never dropped.</div>' +
      '<button class="btn-primary" style="margin-top:10px;" onclick="mergeDupes()">Merge all ' + groups.length + '</button>' +
      '</div>';
  }

  async function mergeDupes(){
    const groups = dupeGroups();
    if (!groups.length) return;
    if (!confirm("Merge " + groups.length + " duplicated businesses?\n\n" +
      "Each survivor keeps everything both copies had. The spare records are then deleted.\n\n" +
      "Take a backup first if you haven't today.")) return;
    const st = document.getElementById("status");
    let merged = 0, removed = 0, failed = 0;
    for (let i = 0; i < groups.length; i++) {
      st.innerHTML = '<div class="muted">Merging ' + (i+1) + ' of ' + groups.length + '…</div>';
      const g = mergeGroup(groups[i]);
      try {
        const rec = Object.assign({}, g.merged);
        delete rec.id; delete rec.isClient; delete rec.outreach;
        const r = await fetch(API, { method:"POST",
          headers:{ "Content-Type":"application/json", Authorization:"Bearer "+token },
          body: JSON.stringify({ lead: rec }) });
        if (!r.ok) throw new Error("HTTP " + r.status);
        merged++;
        // Only delete the spares AFTER the survivor is safely written.
        for (const l of g.losers) {
          if (l.id === g.keeper.id) continue;
          const d = await fetch(API, { method:"POST",
            headers:{ "Content-Type":"application/json", Authorization:"Bearer "+token },
            body: JSON.stringify({ delete: l.id }) });
          if (d.ok) removed++;
        }
      } catch (e) { failed++; }
    }
    st.innerHTML = '<div class="ok">Merged ' + merged + ', removed ' + removed + ' spare record' +
      (removed===1?"":"s") + (failed ? ', ' + failed + ' failed' : '') + '.</div>';
    await loadLeads();
  }

  function exportCSV(){
    // Place ID FIRST and always. Without it a re-imported CSV can't be matched to
    // the record it came from, so leadKey() falls back to name+phone, writes to a
    // different key, and you get two records for one business. That is exactly
    // what produced 106 duplicates on 17 Aug.
    const cols=[["Place ID","placeId"],["Tier","tier"],["Score","score"],["Business Name","businessName"],["Category","category"],["Primary Email","email"],["Phone","phone"],["Google Rating","rating"],["Total Reviews","reviewCount"],["Owner Response Rate","ownerResponseRate"],["Recent Unanswered Poor Reviews","recentUnanswered"],["Key Sales Hook / Review Sample","hook"],["Score Reasons","scoreReasons"],["Flag","flag"],["Direct Review URL","reviewUrl"],["Website","website"],["Address","address"],["Outreach Status","outreachStatus"]];
    const q=v=>{ v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const lines=[cols.map(c=>c[0]).join(",")];
    LEADS.forEach(l=>lines.push(cols.map(c=>{ let v=l[c[1]]; if(c[1]==="phone"&&v)v="'"+v; return q(v); }).join(",")));
    const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="trey-leads.csv"; a.click();
  }

  // ---------- outreach drafting ----------
  // Saved on this device so you don't retype your name/contact/demo link each time.
  const OUT = {
    get(k,d){ try{ return localStorage.getItem("treyOut_"+k) || d; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem("treyOut_"+k, v); }catch(e){} }
  };
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

  // Parse the scored hook  [1★ 01/08/2026] "text..."  → {stars, month, snippet}
  function parseHook(h){
    if(!h) return null;
    const m=String(h).match(/^\s*\[\s*(\d+)\s*★\s*([0-9]{1,2}\/[0-9]{1,2}\/[0-9]{2,4})?\s*\]\s*"?([\s\S]*?)"?\s*$/);
    if(!m) return null;
    let month="recently";
    if(m[2]){ const p=m[2].split("/"); const mi=parseInt(p[1],10); if(mi>=1&&mi<=12) month=MONTHS[mi-1]; }
    let snip=(m[3]||"").replace(/\s+/g," ").trim();
    const w=snip.split(" "); if(w.length>8) snip=w.slice(0,8).join(" ");
    snip=snip.replace(/[.,;:!?"'\-–—]+$/,"").trim();
    return { stars:m[1], month:month, snippet:snip };
  }
  // Best-effort town/city from a scraped address (strip country + postcode).
  function guessCity(addr){
    if(!addr) return "";
    let parts=String(addr).split(",").map(s=>s.trim()).filter(Boolean).filter(p=>!/^(uk|united kingdom|england|scotland|wales)$/i.test(p));
    if(!parts.length) return "";
    let last=parts[parts.length-1].replace(/\b[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}\b/i,"").trim();
    if(last) return last;
    return parts.length>1 ? parts[parts.length-2] : parts[0];
  }
  function waNumber(p){ if(!p) return ""; let d=String(p).replace(/[^\d]/g,""); if(!d) return ""; if(d.charAt(0)==="0") d="44"+d.slice(1); return d; }

  function draftMessages(l){
    const sender=OUT.get("sender","")||"[your name]";
    const contact=OUT.get("contact","")||"[your phone / email / site]";
    const demo=OUT.get("demo","")||"[your demo link]";
    const link=demo;
    const biz=(l.businessName||"there").toString().trim();
    const firstName=(l.contactName&&l.contactName.trim())?l.contactName.trim().split(/\s+/)[0]:"there";
    const cat=((l.category||"business").toString().toLowerCase().trim())||"business";
    const city=guessCity(l.address)||"your area";
    const ratingTxt=(l.rating!=null&&l.rating!=="")?(" — "+l.rating+"★"):"";
    const h=parseHook(l.hook);
    const d={ hasHook:!!h, hook:h };
    if(h){
      d.wa1='Hi, is this the owner of '+biz+'? 👋\n\nI had a look at your Google reviews and noticed a '+h.stars+'★ from '+h.month+' — the one mentioning "'+h.snippet+'" — still hasn\'t had a reply.\n\nI help '+city+' '+cat+' owners turn those around, and bring in fresh 5★ ones so the odd bad review doesn\'t sit on top.\n\nWant me to send you the reply I\'d post? Takes me 30 seconds.\n\n— '+sender+', Trey';
      d.wa2='Morning '+biz+' 🙂 following up on that '+h.stars+'★ review from '+h.month+'.\n\nNo pressure at all. Here\'s a 20-second look at how Trey handles it: '+link+'\n\nOr I can just WhatsApp you the draft reply — whichever\'s easier?';
      d.emSub1=biz+' — a review you might\'ve missed';
      d.emBody1='Hi '+firstName+',\n\nI was going through Google reviews for a few '+cat+' businesses around '+city+' and noticed '+biz+' has a '+h.stars+'★ from '+h.month+' — the one mentioning "'+h.snippet+'" — that hasn\'t had a reply yet.\n\nAn unanswered review like that quietly puts off more people than it should.\n\nI run Trey, a small East Midlands tool that does two things: it drafts a reply for you to approve in one tap on your phone, and it adds a little tap-card on your counter that brings in fresh 5★ reviews so the odd bad one doesn\'t sit on top.\n\nHappy to send you the exact reply I\'d post to that '+h.stars+'★ — or walk you through the whole thing in a quick 10-minute demo. Which is easier?\n\nCheers,\n'+sender+'\nTrey · '+contact+'\n\nNot for you? Reply "no thanks" and I won\'t email again.';
      d.emBody2='Hi '+firstName+',\n\nFloating this back up in case it slipped past. Here\'s a 60-second look at how Trey handles a review like that '+h.stars+'★ one: '+demo+'\n\nOr just reply "draft" and I\'ll send you the reply I\'d post to it — no strings.\n\n'+sender;
    } else {
      d.wa1='Hi, is this '+biz+'? 👋 You\'re doing well on Google'+ratingTxt+'. I help '+cat+' owners near '+city+' get more of those 5★ reviews with a tap-card on the counter, and reply to every review in a single tap. Want to see how it\'d look for you? '+link+'\n\n— '+sender+', Trey';
      d.wa2='Morning '+biz+' 🙂 just floating this back up.\n\nHere\'s a 20-second look at how Trey brings in more 5★ reviews: '+link+'\n\nWorth a quick look?';
      d.emSub1='more 5★ for '+biz+'?';
      d.emBody1='Hi '+firstName+',\n\n'+biz+' is doing well on Google'+ratingTxt+'. I help East Midlands '+cat+' owners turn that into more reviews: a tap-card on the counter that brings in fresh 5★, plus one-tap replies to every review that comes in.\n\nWorth a quick 10-minute demo? I can show you exactly how it\'d look for '+biz+': '+demo+'\n\nCheers,\n'+sender+'\nTrey · '+contact+'\n\nNot for you? Reply "no thanks" and I won\'t email again.';
      d.emBody2='Hi '+firstName+',\n\nFloating this back up in case it slipped past. Here\'s a 60-second look at how Trey brings in more 5★ reviews: '+demo+'\n\n'+sender;
    }
    // Shared final touches (channel-agnostic wording)
    d.wa3='Last one from me, promise!\n\nRight now most of '+biz+'\'s recent Google reviews don\'t have an owner reply — customers (and Google) quietly notice.\n\nTrey drafts every reply for you to approve in one tap, and adds a little tap-card on your counter that brings in new 5★ reviews.\n\nIf it\'s not for you, no worries — I\'ll leave you be. '+link;
    d.emBody3='Hi '+firstName+',\n\nI\'ll leave it here so I\'m not cluttering your inbox. Short version:\n\nMost of '+biz+'\'s recent Google reviews don\'t have an owner reply, and that costs you the odd customer who\'s checking you out. Trey fixes that in one tap and helps bring in new reviews — and as I\'m local to the East Midlands, I\'m happy to drop the tap-card round in person.\n\nIf you ever fancy a look: '+demo+'\n\nEither way, all the best with '+biz+'.\n\n'+sender;
    d.emSub2="Re: "+d.emSub1;
    d.emSub3="Re: "+d.emSub1;
    return d;
  }

  function openDraft(i){
    const l=LEADS[i]; if(!l) return;
    const d=draftMessages(l);
    DRAFT_STATE={ phone:waNumber(l.phone), email:(l.email||"").trim() };
    const waAct=id=>'<button class="copybtn" onclick="copyTa(\''+id+'\',this)">Copy</button>'+(DRAFT_STATE.phone?' <button class="linkbtn" onclick="openWa(\''+id+'\')">Open WhatsApp</button>':'');
    const emAct=(s,b)=>'<button class="copybtn" onclick="copyTa(\''+b+'\',this)">Copy body</button>'+(DRAFT_STATE.email?' <button class="linkbtn" onclick="composeEmail(\''+s+'\',\''+b+'\')">Compose</button>':'');
    const waBlock=(label,id)=>'<div class="msgblock"><div class="mhead"><span class="mlabel">'+label+'</span><span>'+waAct(id)+'</span></div><textarea id="'+id+'"></textarea></div>';
    const emBlock=(label,s,b)=>'<div class="msgblock"><div class="mhead"><span class="mlabel">'+label+'</span><span>'+emAct(s,b)+'</span></div><label style="margin:0 0 4px;">Subject</label><input id="'+s+'"/><label>Body</label><textarea id="'+b+'"></textarea></div>';
    const subline=d.hasHook?('Leading with the '+d.hook.stars+'★ from '+d.hook.month):'No unanswered review on file — using the “more reviews” angle.';
    const html='<div class="modal">'+
      '<span class="modal-close" onclick="closeDraft()">×</span>'+
      '<h3>Draft outreach — '+esc(l.businessName||"(no name)")+'</h3>'+
      '<div class="msub">'+esc(subline)+' · everything below is editable before you send.</div>'+
      '<div class="senderbox"><div style="font-size:12px;color:#475569;font-weight:700;margin-bottom:6px;">Your details — saved on this device, used in every draft</div>'+
        '<div class="row">'+
          '<div><label>Your name</label><input id="out_sender" value="'+esc(OUT.get("sender",""))+'"/></div>'+
          '<div><label>Your contact (phone / email / site)</label><input id="out_contact" value="'+esc(OUT.get("contact",""))+'"/></div>'+
          '<div><label>Demo / booking link</label><input id="out_demo" value="'+esc(OUT.get("demo",""))+'"/></div>'+
        '</div>'+
        '<div style="margin-top:8px;"><button class="btn-secondary" onclick="regenDraft('+i+')">↻ Apply my details</button></div>'+
      '</div>'+
      '<div class="chanhdr">WhatsApp / SMS</div>'+
      waBlock("First touch","wa_1")+waBlock("Follow-up (2–3 days)","wa_2")+waBlock("Final touch (4–5 days)","wa_3")+
      '<div class="chanhdr">Email</div>'+
      emBlock("First touch","em_sub_1","em_body_1")+emBlock("Follow-up (3–4 days)","em_sub_2","em_body_2")+emBlock("Final touch (5–7 days)","em_sub_3","em_body_3")+
    '</div>';
    const m=document.getElementById("draftModal"); m.innerHTML=html; m.style.display="block";
    val("wa_1",d.wa1); val("wa_2",d.wa2); val("wa_3",d.wa3);
    val("em_sub_1",d.emSub1); val("em_body_1",d.emBody1);
    val("em_sub_2",d.emSub2); val("em_body_2",d.emBody2);
    val("em_sub_3",d.emSub3); val("em_body_3",d.emBody3);
  }
  function val(id,v){ const e=document.getElementById(id); if(e) e.value=v; }
  function closeDraft(){ const m=document.getElementById("draftModal"); m.style.display="none"; m.innerHTML=""; }
  function saveOut(){ const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";}; OUT.set("sender",g("out_sender")); OUT.set("contact",g("out_contact")); OUT.set("demo",g("out_demo")); }
  function regenDraft(i){ saveOut(); openDraft(i); }
  function copyTa(id,btn){
    const e=document.getElementById(id); if(!e) return;
    const done=function(){ if(btn){ const o=btn.textContent; btn.textContent="Copied ✓"; btn.classList.add("ok"); setTimeout(function(){ btn.textContent=o; btn.classList.remove("ok"); },1400); } };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(e.value).then(done).catch(fb); } else { fb(); }
    function fb(){ e.focus(); e.select(); try{ document.execCommand("copy"); done(); }catch(_){} }
  }
  function openWa(id){ const e=document.getElementById(id); if(!e||!DRAFT_STATE.phone) return; window.open("https://wa.me/"+DRAFT_STATE.phone+"?text="+encodeURIComponent(e.value),"_blank"); }
  function composeEmail(s,b){ const se=document.getElementById(s), be=document.getElementById(b); const sub=se?se.value:"", body=be?be.value:""; window.location.href="mailto:"+DRAFT_STATE.email+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(body); }

  function boot(){ document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block"; loadLeads(); }
  if(token) boot();
</script>
